syntax = "proto3";

package title.v1;

import "google/api/annotations.proto";

option go_package = "title-api/api/title/v1;titlev1";

service TitleService {
  rpc SearchTitles(SearchTitlesQuery) returns (SearchTitlesQueryResponse) {
    option (google.api.http) = {
      get: "/v1/search"
    };
  }

  rpc GetPlaybackStreams(GetPlaybackStreamsQuery) returns (GetPlaybackStreamsQueryResponse) {
    option (google.api.http) = {
      get: "/v1/titles/{title_id}/playback-streams"
    };
  }

  rpc GetTitleDetails(GetTitleDetailsQuery) returns (GetTitleDetailsQueryResponse) {
    option (google.api.http) = {
      get: "/v1/titles/{title_id}"
    };
  }

  rpc GetMarkingSettings(GetMarkingSettingsQuery) returns (MarkingSettings) {
    option (google.api.http) = {
      get: "/v1/marking"
    };
  }

  rpc UpdateMarkingSettings(UpdateMarkingSettingsCommand) returns (MarkingSettings) {
    option (google.api.http) = {
      post: "/v1/marking"
      body: "*"
    };
  }

  rpc MarkEpisode(MarkEpisodeCommand) returns (MarkEpisodeCommandResponse) {
    option (google.api.http) = {
      post: "/v1/titles/{title_id}/marking"
      body: "*"
    };
  }

  rpc GetTmdbSettings(GetTmdbSettingsQuery) returns (TmdbSettings) {
    option (google.api.http) = {
      get: "/v1/tmdb"
    };
  }

  rpc UpdateTmdbSettings(UpdateTmdbSettingsCommand) returns (TmdbSettings) {
    option (google.api.http) = {
      post: "/v1/tmdb"
      body: "*"
    };
  }

  rpc GetTmdbDetails(GetTmdbDetailsQuery) returns (TmdbDetails) {
    option (google.api.http) = {
      get: "/v1/tmdb/{media_type}/{tmdb_id}"
    };
  }

  rpc GetTmdbSeason(GetTmdbSeasonQuery) returns (TmdbSeason) {
    option (google.api.http) = {
      get: "/v1/tmdb/tv/{tmdb_id}/seasons/{season_number}"
    };
  }

  rpc GetTmdbCast(GetTmdbDetailsQuery) returns (TmdbCast) {
    option (google.api.http) = {
      get: "/v1/tmdb/{media_type}/{tmdb_id}/cast"
    };
  }

  // After GetTmdbDetails, so that the gateway tries it first: its path
  // would be a details' of media type "person".
  rpc GetTmdbPerson(GetTmdbPersonQuery) returns (TmdbPersonDetails) {
    option (google.api.http) = {
      get: "/v1/tmdb/person/{tmdb_id}"
    };
  }

  rpc SearchTmdbPeople(SearchTmdbPeopleQuery) returns (TmdbPeople) {
    option (google.api.http) = {
      post: "/v1/tmdb/people/search"
      body: "*"
    };
  }

  rpc WaitTmdbMatch(WaitTmdbMatchQuery) returns (TmdbMatch) {
    option (google.api.http) = {
      get: "/v1/titles/{title_id}/tmdb"
    };
  }

  rpc LookupTmdbTitle(LookupTmdbTitleCommand) returns (TmdbLookup) {
    option (google.api.http) = {
      post: "/v1/tmdb/{media_type}/{tmdb_id}/lookup"
    };
  }

  rpc GetSeriesUpdates(GetSeriesUpdatesQuery) returns (GetSeriesUpdatesQueryResponse) {
    option (google.api.http) = {
      post: "/v1/series/updates"
      body: "*"
    };
  }
}

enum MediaType {
  MEDIA_TYPE_UNSPECIFIED = 0;
  MEDIA_TYPE_MOVIE = 1;
  MEDIA_TYPE_SERIES = 2;
}

message SearchTitlesQuery {
  string query = 1;
}

message SearchTitlesQueryResponse {
  message SearchResult {
    string title_id = 1;
    string title = 2;
    string year = 3;
    string poster_link = 4;
  }

  repeated SearchResult results = 1;
}

message GetPlaybackStreamsQuery {
  string title_id = 1;
  optional int32 season_number = 2;
  optional string episode_number = 3;
  // The viewer plays the title for the first time: its episodes are marked
  // from then on, those the primary player marks none of (see
  // MarkingSettings).
  bool first_play = 4;
}

message GetPlaybackStreamsQueryResponse {
  repeated MediaStream streams = 1;
}

message GetTitleDetailsQuery {
  string title_id = 1;
}

message GetTitleDetailsQueryResponse {
  message Rating {
    string source = 1;
    double value = 2;
  }

  message Season {
    message Episode {
      string episode_number = 1;
      string title = 2;
      uint64 duration_seconds = 3;
      // Marked on a video of duration_seconds.
      repeated Section sections = 4;
    }

    int32 season_number = 1;
    repeated Episode episodes = 2;
  }

  string title_id = 1;
  string title = 2;
  string original_title = 3;
  string year = 4;
  string description = 5;
  string poster_link = 6;
  MediaType media_type = 7;
  string quality = 8;
  repeated string countries = 9;
  repeated string genres = 10;
  repeated string directors = 11;
  repeated string actors = 12;
  repeated Rating ratings = 13;
  uint64 duration_seconds = 14;
  repeated Season seasons = 15;
  // A movie's, marked on a video of duration_seconds; an episode's are with
  // the episode.
  repeated Section sections = 16;
  // The title on TMDB, once it is matched (see TmdbSettings).
  TmdbTitle tmdb = 17;
}

// The title on TMDB of a title GetTitleDetails told without one, as it is
// matched in the background: waited for up to 15 s.
message WaitTmdbMatchQuery {
  string title_id = 1;
}

message TmdbMatch {
  // Once it is matched.
  TmdbTitle tmdb = 1;
  // Still to be matched, as the wait ended first: to be asked again.
  bool pending = 2;
}

// A title on TMDB to be looked for on the provider: what the provider's
// search finds by its Russian name and its original one, three titles at
// most, of its year or one off, is matched with TMDB by name all at once,
// then by Claude one at a time, in the background; waited for up to 15 s. A title not found is
// looked for again a week later, one whose lookup failed half an hour
// later. FAILED_PRECONDITION with no TMDB key.
message LookupTmdbTitleCommand {
  // "movie" or "tv".
  string media_type = 1;
  uint64 tmdb_id = 2;
}

message TmdbLookup {
  enum State {
    STATE_UNSPECIFIED = 0;
    // Still being looked for, as the wait ended first: to be asked again.
    STATE_PENDING = 1;
    STATE_FOUND = 2;
    STATE_NOT_FOUND = 3;
  }

  State state = 1;
  // The title on the provider, when found.
  string title_id = 2;
}

// A title on TMDB: themoviedb.org/<movie or tv>/<id>.
message TmdbTitle {
  uint64 id = 1;
  MediaType media_type = 2;
}

// A part of a movie or an episode that viewers may skip, as the primary
// player marks it, in seconds from the start of the video.
message Section {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // What happened in the earlier episodes.
    KIND_RECAP = 1;
    // The opening titles.
    KIND_INTRO = 2;
    // The end titles.
    KIND_CREDITS = 3;
  }

  Kind kind = 1;
  double start_seconds = 2;
  double end_seconds = 3;
  // False when there is more to see, such as a scene after the credits.
  bool skippable = 4;
}

message MediaStream {
  message ProxyHeader {
    string name = 1;
    string value = 2;
  }

  message AudioTrack {
    string id = 1;
    string name = 2;
    string language = 3;
    bool default = 4;
    string playlist_url = 5;
  }

  message SubtitleTrack {
    string id = 1;
    string name = 2;
    string language = 3;
    bool forced = 4;
    string playlist_url = 5;
  }

  string master_playlist_url = 1;
  repeated AudioTrack audio_tracks = 2;
  repeated SubtitleTrack subtitles = 3;
  repeated ProxyHeader proxy_headers = 4;
  string name = 5;
  // The sections of the movie or the episode, which all its streams share:
  // the primary player's, marked on its video of sections_duration_seconds.
  // Another stream's video may be a little longer or shorter.
  repeated Section sections = 6;
  double sections_duration_seconds = 7;
  // The master playlist as title-api fetched it from the CDN, of a primary
  // player's stream: the router needn't fetch it again before the TV does.
  // Empty for the alternative player's, which title-api assembles.
  string master_playlist = 8;
}

message GetMarkingSettingsQuery {}

// How title-api marks the recap, the intro and the credits of the episodes
// the primary player marks none of, with Claude: in the background, of the
// titles first played since, the episode played and the two after it.
message MarkingSettings {
  bool enabled = 1;
  // Whether there is a Claude API key, and its last four characters.
  bool key_set = 2;
  string key_hint = 3;
  // Why the last marking failed, if it did.
  string error = 4;
}

message UpdateMarkingSettingsCommand {
  optional bool enabled = 1;
  // A Claude API key, which is checked before it is kept; empty removes it.
  optional string api_key = 2;
}

// A series the viewer saved to watch: its episodes are marked from then on,
// as of one played first (see GetPlaybackStreamsQuery.first_play), and the
// episode it would start with is put in the queue alone, if the primary
// player marks none of it.
message MarkEpisodeCommand {
  string title_id = 1;
  int32 season_number = 2;
  string episode_number = 3;
}

message MarkEpisodeCommandResponse {}

message GetTmdbSettingsQuery {}

// How title-api matches its titles with TMDB: in the background, each
// title the first time its details are asked for, by TMDB's search, and
// with Claude (the key of MarkingSettings) when the search finds no title
// or several that fit.
message TmdbSettings {
  // Whether there is a TMDB API key (or read access token), and its last
  // four characters.
  bool key_set = 1;
  string key_hint = 2;
  // Why the last match failed, if it did.
  string error = 3;
}

message UpdateTmdbSettingsCommand {
  // A TMDB API key or read access token, which is checked before it is
  // kept; empty removes it.
  string api_key = 1;
}

// A title on TMDB by its ID, whether title-api has it or not (see
// GetTitleDetailsQueryResponse.tmdb). NOT_FOUND when TMDB doesn't have it,
// FAILED_PRECONDITION with no TMDB key.
message GetTmdbDetailsQuery {
  // "movie" or "tv", as TMDB's paths name them: a movie and a series may
  // share an ID.
  string media_type = 1;
  uint64 tmdb_id = 2;
}

// What a title's page shows of a title on TMDB, in Russian, chosen by
// title-api; what TMDB lacks is empty. A picture is a file of
// /v1/tmdb/images/{size}/{file}.
message TmdbDetails {
  TmdbTitle title = 1;
  string name = 2;
  string original_name = 3;
  string year = 4;
  string tagline = 5;
  string overview = 6;
  // Without text, 1280 wide or more where TMDB has one.
  string backdrop_path = 7;
  // A PNG, in Russian, else English, else in no language.
  string logo_path = 8;
  // The logo's width to its height.
  double logo_aspect = 9;
  string poster_path = 10;
  // In the Russian scale: 0+, 6+, 12+, 16+ or 18+; the American rating
  // translated where there is no Russian one.
  string age = 11;
  double vote_average = 12;
  // A movie's.
  uint32 runtime_minutes = 13;
  repeated string genres = 14;
  repeated string countries = 15;
  // A series'.
  TmdbStatus status = 16;
  TmdbEpisodeRef next_episode = 17;
  TmdbEpisodeRef last_episode = 18;
  uint32 number_of_seasons = 19;
  // The first 12 billed, with a photo or not; GetTmdbCast tells them all.
  repeated TmdbPerson cast = 21;
  // Up to 4 trailers and teasers on YouTube, Russian and official first.
  repeated TmdbVideo videos = 22;
  TmdbCollection collection = 23;
  // Up to 12, those with a poster.
  repeated TmdbRelated recommendations = 24;
  // title-api's title of it, if it is matched.
  string title_id = 25;
  // A series' seasons, the specials left out.
  repeated TmdbSeasonRef seasons = 27;
  string release_date = 28;
  // How many people GetTmdbCast tells.
  uint32 cast_total = 29;
  // A series'.
  repeated TmdbPerson creators = 30;
  // A movie's.
  repeated TmdbPerson directors = 31;

  // Names alone, before people had their IDs.
  reserved 20, 26;
}

// Who is in a title on TMDB, as billed.
message TmdbCast {
  repeated TmdbPerson cast = 1;
}

enum TmdbStatus {
  TMDB_STATUS_UNSPECIFIED = 0;
  TMDB_STATUS_RETURNING = 1;
  TMDB_STATUS_ENDED = 2;
  TMDB_STATUS_CANCELED = 3;
  // In production, planned, a pilot.
  TMDB_STATUS_OTHER = 4;
}

message TmdbEpisodeRef {
  int32 season_number = 1;
  int32 episode_number = 2;
  string air_date = 3;
  // Empty when TMDB has it as its number alone, or not in Russian.
  string name = 4;
}

message TmdbSeasonRef {
  int32 season_number = 1;
  int32 episode_count = 2;
  string air_date = 3;
  string name = 4;
}

message TmdbPerson {
  string name = 1;
  string character = 2;
  // Empty when TMDB has no photo.
  string profile_path = 3;
  // GetTmdbPerson tells of the person by it.
  uint64 id = 4;
}

// A person on TMDB by their ID. NOT_FOUND when TMDB doesn't have them,
// FAILED_PRECONDITION with no TMDB key.
message GetTmdbPersonQuery {
  uint64 tmdb_id = 1;
}

// What a person's page shows of someone on TMDB, in Russian, chosen by
// title-api; what TMDB lacks is empty.
message TmdbPersonDetails {
  uint64 id = 1;
  string name = 2;
  // Their name in English when it is not the same.
  string original_name = 3;
  string profile_path = 4;
  // What they are known for, in Russian: "Актриса", "Режиссёр".
  string profession = 5;
  // 2006-01-02, or a year alone.
  string birthday = 6;
  string deathday = 7;
  string place_of_birth = 8;
  // In English where TMDB has none in Russian.
  string biography = 9;
  TmdbGender gender = 10;
  repeated TmdbLink links = 11;
  // The titles they are in or made, the best known first: each title once,
  // with all they were in it; appearances as themselves left out.
  repeated TmdbCredit credits = 12;
}

// People on TMDB by name, in any of the names TMDB has of them, a page of
// 20 at a time. FAILED_PRECONDITION with no TMDB key.
message SearchTmdbPeopleQuery {
  string query = 1;
  // From 1, the first if unset; 500 at most.
  uint32 page = 2;
  // What the viewer watched, of which the titles of each person found are
  // counted: titles of TMDB as "movie:550", "tv:1405", and title-api's
  // titles, those matched with TMDB's; 1000 of each at most.
  repeated string watched_tmdb = 3;
  repeated string watched_title_ids = 4;
}

message TmdbPeople {
  uint32 page = 1;
  uint32 total_pages = 2;
  uint32 total_results = 3;
  // Those of whom titles were watched first, the most first; the best
  // known first else.
  repeated TmdbPersonFound people = 4;
}

message TmdbPersonFound {
  uint64 id = 1;
  // In Russian where TMDB has it so.
  string name = 2;
  // Their name in English when it is not the same.
  string original_name = 3;
  string profile_path = 4;
  // What they are known for, in Russian: "Актриса", "Режиссёр".
  string profession = 5;
  TmdbGender gender = 6;
  // How many of their titles were watched, of those the query tells.
  uint32 watched = 7;
  // The best known of their titles with a poster, 3 at most.
  repeated TmdbRelated known_for = 8;
}

enum TmdbGender {
  TMDB_GENDER_UNSPECIFIED = 0;
  TMDB_GENDER_FEMALE = 1;
  TMDB_GENDER_MALE = 2;
  TMDB_GENDER_NON_BINARY = 3;
}

// A page of a person elsewhere.
message TmdbLink {
  // "tmdb", "imdb", "kinopoisk", "wikipedia" or "instagram".
  string site = 1;
  string url = 2;
}

message TmdbCredit {
  TmdbRelated title = 1;
  // Whom they play, empty when they don't or TMDB doesn't tell.
  string character = 2;
  // What else they did in it, in Russian: "Режиссёр", "Сценарий".
  repeated string jobs = 3;
  // A series' episodes they are in, if TMDB tells.
  uint32 episodes = 4;
  // Played in it, whether TMDB tells whom or not.
  bool acting = 5;
}

message TmdbVideo {
  // youtube.com/watch?v=<youtube_key>
  string youtube_key = 1;
  string name = 2;
  string language = 3;
  // "Trailer" or "Teaser".
  string kind = 4;
}

// A collection's parts in the order they came out, those with no date
// yet last.
message TmdbCollection {
  uint64 id = 1;
  string name = 2;
  repeated TmdbRelated parts = 3;
}

message TmdbRelated {
  TmdbTitle title = 1;
  string name = 2;
  string year = 3;
  string release_date = 4;
  string poster_path = 5;
  string backdrop_path = 6;
  // title-api's title of it, if it is matched.
  string title_id = 7;
}

// A season of a series on TMDB. One TMDB doesn't number so, as the
// provider's season 9 of Dexter, which TMDB has as a series of its own,
// has no episodes.
message GetTmdbSeasonQuery {
  uint64 tmdb_id = 1;
  int32 season_number = 2;
}

message TmdbSeason {
  repeated TmdbEpisode episodes = 1;
}

message TmdbEpisode {
  int32 episode_number = 1;
  // Empty when TMDB has it as its number alone, or not in Russian.
  string name = 2;
  // In English where TMDB has none in Russian.
  string overview = 3;
  string still_path = 4;
  string air_date = 5;
  uint32 runtime_minutes = 6;
  // Not aired yet: its date is to come or unknown.
  bool upcoming = 7;
}

// What is new of series: their last episode on the provider and what TMDB
// has coming, for the main page's badges.
message GetSeriesUpdatesQuery {
  // The series whose last episode on the provider is told, at most 30,
  // asked of it one by one, as long as the request may take: those it
  // takes too long for come without it, fetched meanwhile for the next
  // request. A series' episodes are kept for 5 minutes.
  repeated string title_ids = 1;
  // The series of which only what TMDB has coming is told, at most 30.
  repeated string upcoming_title_ids = 2;
}

message GetSeriesUpdatesQueryResponse {
  // Of the titles asked for, those not known to be movies, as asked.
  repeated SeriesUpdate updates = 1;
}

message SeriesUpdate {
  string title_id = 1;
  // The provider's last episode, empty when not asked for or not told in
  // time.
  int32 last_season = 2;
  string last_episode = 3;
  // As TMDB has the series, of the details kept of it: unspecified, and no
  // next episode, until it is matched and its details are kept.
  TmdbStatus status = 4;
  TmdbEpisodeRef next_episode = 5;
  // The provider's episodes by season, in order, as last_* tell them.
  repeated SeriesSeason seasons = 6;
}

message SeriesSeason {
  int32 season_number = 1;
  repeated string episode_numbers = 2;
}
