syntax = "proto3";

package title.v1;

import "google/api/annotations.proto";

option go_package = "title-api/api/title/v1;titlev1";

service TitleService {
  rpc SearchTitles(SearchTitlesQuery) returns (SearchTitlesQueryResponse) {
    option (google.api.http) = {
      get: "/v1/search"
    };
  }

  rpc GetPlaybackStreams(GetPlaybackStreamsQuery) returns (GetPlaybackStreamsQueryResponse) {
    option (google.api.http) = {
      get: "/v1/titles/{title_id}/playback-streams"
    };
  }

  rpc GetTitleDetails(GetTitleDetailsQuery) returns (GetTitleDetailsQueryResponse) {
    option (google.api.http) = {
      get: "/v1/titles/{title_id}"
    };
  }
}

enum MediaType {
  MEDIA_TYPE_UNSPECIFIED = 0;
  MEDIA_TYPE_MOVIE = 1;
  MEDIA_TYPE_SERIES = 2;
}

message SearchTitlesQuery {
  string query = 1;
}

message SearchTitlesQueryResponse {
  message SearchResult {
    string title_id = 1;
    string title = 2;
    string year = 3;
    string poster_link = 4;
  }

  repeated SearchResult results = 1;
}

message GetPlaybackStreamsQuery {
  string title_id = 1;
  optional int32 season_number = 2;
  optional string episode_number = 3;
}

message GetPlaybackStreamsQueryResponse {
  repeated MediaStream streams = 1;
}

message GetTitleDetailsQuery {
  string title_id = 1;
}

message GetTitleDetailsQueryResponse {
  message Rating {
    string source = 1;
    double value = 2;
  }

  message Season {
    message Episode {
      string episode_number = 1;
      string title = 2;
      uint64 duration_seconds = 3;
      // Marked on a video of duration_seconds.
      repeated Section sections = 4;
    }

    int32 season_number = 1;
    repeated Episode episodes = 2;
  }

  string title_id = 1;
  string title = 2;
  string original_title = 3;
  string year = 4;
  string description = 5;
  string poster_link = 6;
  MediaType media_type = 7;
  string quality = 8;
  repeated string countries = 9;
  repeated string genres = 10;
  repeated string directors = 11;
  repeated string actors = 12;
  repeated Rating ratings = 13;
  uint64 duration_seconds = 14;
  repeated Season seasons = 15;
  // A movie's, marked on a video of duration_seconds; an episode's are with
  // the episode.
  repeated Section sections = 16;
}

// A part of a movie or an episode that viewers may skip, as the primary
// player marks it, in seconds from the start of the video.
message Section {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // What happened in the earlier episodes.
    KIND_RECAP = 1;
    // The opening titles.
    KIND_INTRO = 2;
    // The end titles.
    KIND_CREDITS = 3;
  }

  Kind kind = 1;
  double start_seconds = 2;
  double end_seconds = 3;
  // False when there is more to see, such as a scene after the credits.
  bool skippable = 4;
}

message MediaStream {
  message ProxyHeader {
    string name = 1;
    string value = 2;
  }

  message AudioTrack {
    string id = 1;
    string name = 2;
    string language = 3;
    bool default = 4;
    string playlist_url = 5;
  }

  message SubtitleTrack {
    string id = 1;
    string name = 2;
    string language = 3;
    bool forced = 4;
    string playlist_url = 5;
  }

  string master_playlist_url = 1;
  repeated AudioTrack audio_tracks = 2;
  repeated SubtitleTrack subtitles = 3;
  repeated ProxyHeader proxy_headers = 4;
  string name = 5;
  // The sections of the movie or the episode, which all its streams share:
  // the primary player's, marked on its video of sections_duration_seconds.
  // Another stream's video may be a little longer or shorter.
  repeated Section sections = 6;
  double sections_duration_seconds = 7;
}
