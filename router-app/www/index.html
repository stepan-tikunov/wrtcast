<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<title>Cast</title>
<style>
:root{--bg:#0e0e10;--s1:#18181b;--s2:#232327;--s3:#2e2e33;--tx:#f2f2f3;--mu:#8e8e96;--ac:#ffb020;--err:#d8433a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.45}
svg{width:24px;height:24px;fill:currentColor;flex:none}
.ib{display:grid;place-items:center;width:48px;height:48px;padding:0;border:0;border-radius:50%;background:none}
.ib:active,.pill:active,.card:active,.ep:active{transform:scale(.96)}
.ib,.pill,.card,.ep{transition:transform .12s}

header{position:sticky;top:0;z-index:2;display:flex;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:linear-gradient(var(--bg) 70%,#0e0e1000)}
#f{position:relative;flex:1}
#devbtn{width:46px;height:46px;border-radius:14px;background:var(--s2);color:var(--mu)}
#devbtn.on{color:var(--ac)}
#f svg{position:absolute;left:14px;top:13px;width:20px;height:20px;color:var(--mu)}
#q{width:100%;height:46px;padding:0 46px 0 42px;border:0;border-radius:14px;background:var(--s2);outline:none;font-size:17px;-webkit-user-select:text;user-select:text}
#q:focus{box-shadow:0 0 0 2px var(--ac)}
#q::-webkit-search-cancel-button{display:none}
#qx{position:absolute;right:0;top:0;width:46px;height:46px;color:var(--mu)}
#qx svg{position:static;width:22px;height:22px}

#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:16px 12px;padding:4px 12px 120px}
.card{position:relative;display:block;align-self:start;padding:0;border:0;background:none;text-align:left}
.card img,.card i{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:12px;background:var(--s2)}
.card i{display:grid;place-items:center;color:#55555c;font:600 40px system-ui;font-style:normal}
.card b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:7px;font-size:14px;font-weight:550}
.card span{color:var(--mu);font-size:13px}
.badge{position:absolute;top:6px;left:6px;padding:2px 7px;border-radius:6px;background:#000c;color:#ddd!important;font-size:11px!important;font-weight:600}
.badge.on{left:auto;right:6px;background:var(--ac);color:#111!important}
#rtitle{margin:0;padding:4px 12px 10px;font-size:17px}
.pw{position:relative}
.pw .bar{position:absolute;left:6px;right:6px;bottom:6px;height:4px;border-radius:2px;background:#000a;overflow:hidden}
.pw .bar div{height:100%;background:var(--ac)}
.note{padding:56px 24px;color:var(--mu);text-align:center}
.note svg{display:block;width:48px;height:48px;margin:0 auto 12px;opacity:.5}

/* details page */
#det{position:fixed;inset:0;z-index:4;overflow-y:auto;background:var(--bg);padding-bottom:120px}
#det .top{position:relative;overflow:hidden;overflow:clip;padding:max(8px,env(safe-area-inset-top)) 16px 20px}
#dbg{position:absolute;inset:-40px;background:center/cover;filter:blur(40px) brightness(.45);transform:scale(1.2)}
#det .nav{position:relative;margin-left:-8px}
#det .hero{position:relative;display:flex;gap:16px;align-items:flex-end}
#det .hero>div{flex:1}
#dposter{width:112px;aspect-ratio:2/3;object-fit:cover;border-radius:12px;background:var(--s2);box-shadow:0 8px 24px #0008}
#det h1{margin:0 0 4px;font-size:22px;line-height:1.2}
#dmeta{color:#c8c8cc;font-size:14px}
#dmeta .orig{margin-bottom:2px;color:var(--mu)}
.rt{display:flex;gap:6px;margin-top:8px}
.rt span{padding:3px 8px;border-radius:7px;background:#ffffff1f;font-size:12px;font-weight:600}
.rt b{color:var(--ac)}
#dinfo{padding:4px 16px 4px}
#ddesc{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;margin:4px 0 10px;color:#c8c8cc;font-size:15px;line-height:1.45;cursor:pointer}
#ddesc.full{-webkit-line-clamp:unset}
.facts{color:var(--mu);font-size:14px}
.facts div{margin:4px 0}
.facts b{color:var(--tx);font-weight:500}
/* Until /title answers: a bar per line, inside the element its text goes to,
   so the page keeps its layout when the text comes. */
#det .skl{display:inline-block;vertical-align:middle;height:.8em;margin:0;border-radius:.4em}
#det .rt .skl{width:58px;height:22px;padding:0;border-radius:7px}
#det h1 .skl{max-width:12em}
#dmeta .skl{max-width:20em}
.facts .skl{max-width:50em}
.pill{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border:0;border-radius:26px;background:var(--s2);font-weight:600}
.pill.ac{background:var(--ac);color:#111}
#dplay{position:relative;width:100%;margin-top:18px}
#dfrom0{position:relative;width:100%;height:44px;margin-top:10px;background:#ffffff1f}
#seasons{display:flex;gap:8px;overflow-x:auto;padding:16px 16px 8px;scrollbar-width:none}
#seasons::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 16px;border:0;border-radius:18px;background:var(--s2);font-size:15px}
.chip.on{background:var(--tx);color:#111;font-weight:600}
#eps{padding:0 16px}
.ep{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:8px 0;border:0;border-bottom:1px solid var(--s2);background:none;text-align:left}
.ep .pb{position:absolute;left:0;bottom:-1px;height:2px;border-radius:1px;background:var(--ac)}
.ep.done span,.ep.done b{color:var(--mu)}
.ep.cont small{color:var(--ac)}
.ep b{min-width:28px;color:var(--mu);font-weight:500}
.ep span{flex:1}
.ep small{color:var(--mu)}
.ep.on,.ep.on b,.ep.on small{color:var(--ac)}

/* player */
#shade{position:fixed;inset:0;z-index:5;background:#000a;animation:fade .2s}
@keyframes fade{from{opacity:0}}
#pl{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:0 16px max(10px,env(safe-area-inset-bottom));border-radius:20px 20px 0 0}
/* The panel's own layer: it slides off the handle near the mini player. */
#plbg{position:absolute;inset:0;z-index:-1;border-radius:inherit;background:var(--s1);box-shadow:0 -6px 30px #000c}
#prog{position:absolute;left:20px;right:20px;top:0;height:3px;border-radius:2px;background:var(--s3);overflow:hidden;pointer-events:none}
#prog div{width:0;height:100%;background:var(--ac)}
/* Faded out where the bar starts, under the handle, to fade in on folding. */
#pl.open #prog{top:13px;opacity:0}
#bar{position:relative;display:flex;align-items:center;gap:12px;min-height:72px}
/* The poster grows with a transform so it does not lay the bar out. */
#thumb{width:48px;height:72px;margin-right:-8px;object-fit:cover;border-radius:6px;background:var(--s2);transform:scale(.8333);transform-origin:left center}
#bar .t{flex:1;min-width:0}
#title{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}
#st{display:flex;align-items:center;gap:6px;min-height:18px;overflow:hidden;color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
/* The episode, then the time folded or a spinner while loading; open, the
   time is under the slider. */
#st>*{flex:none}
#sttm{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
#st .spin,#st i{display:none}
#st.busy .spin{display:block}
#st.sr.tm i{display:inline;font-style:normal}
#pl.open #st:not(.busy) i,#pl.open #st:not(.busy) #sttm{display:none}
#tg{background:var(--tx);color:#111;width:46px;height:46px}
/* Out of the way where it stood in the mini player, to fade in on folding. */
#pl.open #tg{position:absolute;right:0;top:13px;visibility:hidden}
/* Playback speed: white at 1x, the accent otherwise. An invisible select
   over it opens the browser's own picker. */
#spd{position:relative;display:grid;place-items:center;flex:none;min-width:40px;height:48px;padding:0 2px;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
#spd.alt{color:var(--ac)}
#spd select{position:absolute;inset:0;width:100%;height:100%;padding:0;opacity:0;font-size:16px;cursor:pointer}
/* The buttons on the right of the open player sit close together, leaving
   the line under the title room. */
#more,#collapse{width:40px;margin-left:-8px}
#handle{display:none;width:40px;height:5px;margin:8px auto 0;border-radius:3px;background:var(--s3)}
#pl.open #handle{display:block}
#pl.open #thumb{margin-right:0;transform:none;cursor:pointer}
/* Sliders: a thin dim track that, held, grows thicker and wider and lights up. */
.sl{position:relative;flex:1;height:32px;touch-action:none;cursor:pointer}
.sl i{position:absolute;left:0;right:0;top:13px;height:6px;border-radius:3px;background:#ffffff1c;overflow:hidden;transition:.2s;transition-property:left,right,top,height,border-radius}
.sl i b{display:block;width:0;height:100%;background:#ffb020a0;transition:background .2s}
.sl.on i{left:-6px;right:-6px;top:10px;height:12px;border-radius:6px}
.sl.on i b{background:var(--ac)}
.times{display:flex;justify-content:space-between;margin:-4px 0 0;color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums;transition:.2s;transition-property:color,margin}
#pos.on+.times{margin:-2px -6px 0;color:var(--tx);font-weight:600}
.ctl{display:flex;align-items:center;justify-content:center;gap:20px;margin:10px 0}
.ctl.series{justify-content:space-between;gap:0}
.ctl .ib{width:56px;height:56px;background:var(--s2);font-size:15px;font-weight:600}
#pp{width:76px;height:76px;background:var(--tx);color:#111}
#pp svg{width:34px;height:34px}
.row{display:flex;align-items:center;gap:10px;margin:12px 0}
.row .ib{flex:none;background:var(--s2)}
.sel{flex:1;min-width:0}
.sel label{display:block;margin:0 0 4px 4px;color:var(--mu);font-size:12px}
select{width:100%;height:46px;padding:0 12px;border:0;border-radius:14px;background:var(--s2)}
.row .pill{flex:1}
.sw{display:flex;flex:1;align-items:center;gap:12px;min-height:46px;padding:6px 12px;border-radius:14px;background:var(--s2)}
.sw span{flex:1}
.sw small{display:block;color:var(--mu);font-size:12px}
.sw input{appearance:none;-webkit-appearance:none;position:relative;flex:none;width:46px;height:28px;margin:0;border-radius:14px;background:var(--s3);transition:background .2s}
.sw input::before{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--tx);transition:transform .2s}
.sw input:checked{background:var(--ac)}
.sw input:checked::before{transform:translateX(18px)}
#stop{display:block;margin:4px auto 0;padding:10px 16px;border:0;background:none;color:var(--err);font-size:15px}
.spin{width:14px;height:14px;border:2px solid var(--mu);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* device picker */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;flex-direction:column;max-height:calc(100dvh - 48px);padding:8px 16px max(16px,env(safe-area-inset-bottom));background:var(--s1);border-radius:20px 20px 0 0;box-shadow:0 -6px 30px #000c}
.sheet .handle{width:40px;height:5px;margin:0 auto 8px;border-radius:3px;background:var(--s3)}
.sheet h2{display:flex;align-items:center;margin:0 0 4px;font-size:18px}
.sheet h2 span{flex:1}
/* A sheet over the player dims the player too. */
#shade.top{z-index:7}
/* Long lists scroll inside the sheet instead of pushing it off screen. */
#optbody,#devlist,#srclist{min-height:0;overflow-y:auto;overscroll-behavior:contain}
#devlist .dev,#srclist .dev{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:8px 4px;border:0;border-bottom:1px solid var(--s2);background:none;text-align:left}
.dev span{flex:1;min-width:0}
.dev b{display:block;font-weight:550}
.dev small{color:var(--mu)}
.dev svg{color:var(--mu)}
.dev.on,.dev.on svg{color:var(--ac)}
.dev i{width:10px;height:10px;border-radius:50%;background:var(--ac);visibility:hidden}
.dev.on i{visibility:visible}
#devlist .note{padding:24px}
#srclist .dev:disabled{opacity:.45}
.pick{display:flex;gap:6px}
.pick select{flex:1;min-width:0}
#styb{flex:none;width:46px;height:46px;border-radius:14px;background:var(--s2);font-weight:700;font-size:15px}
#stypv{display:grid;place-items:end center;height:110px;margin:8px 0 14px;padding:12px;border-radius:14px;background:linear-gradient(160deg,#4a5a6a,#1d2630 60%,#3b2f2a);overflow:hidden}
#stypv span{padding:1px 6px;border-radius:3px;line-height:1.3;text-align:center;transition:all .2s}
.opt{margin:0 0 8px}
.opt label{display:flex;justify-content:space-between;margin:0 2px;color:var(--mu);font-size:12px}
.opt b{color:var(--tx);font-weight:500;font-variant-numeric:tabular-nums}
#styfont{display:flex;gap:6px;margin:6px 0 10px}
#styfont .chip{flex:1;height:36px;padding:0 8px}
#styreset{display:block;margin:4px auto 0;padding:8px 16px;border:0;background:none;color:var(--mu);font-size:14px}
#devname{display:flex;align-items:center;gap:6px;margin:8px auto 0;padding:6px 12px;border:0;border-radius:16px;background:none;color:var(--mu);font-size:14px}
#devname svg{width:18px;height:18px}

#toast{position:fixed;left:50%;bottom:96px;z-index:9;transform:translateX(-50%);width:max-content;max-width:90%;padding:10px 16px;border-radius:12px;background:var(--err);color:#fff;font-size:14px;box-shadow:0 4px 16px #0008}
#toast:empty{display:none}

/* motion */
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}}
@keyframes bounce{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.12)}}
@keyframes spring{0%{transform:scale(.7)}60%{transform:scale(1.1)}}
@keyframes pulse{50%{opacity:.45}}
@keyframes shim{to{background-position:-200% 0}}
@keyframes slidein{from{transform:translateX(48px);opacity:0}}
@keyframes slideout{to{transform:translateX(48px);opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes rise{from{transform:translateY(100%)}}
@keyframes tin{from{opacity:0;transform:translate(-50%,12px)}}
.card{animation:pop .35s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * 35ms)}
.card img{opacity:0;transition:opacity .35s}
.card img.ld{opacity:1}
.sk{display:block;aspect-ratio:2/3;border-radius:12px}
.sk,.skl,#dposter.loading,#det.loading #dplay{background:linear-gradient(100deg,var(--s2) 40%,var(--s3) 50%,var(--s2) 60%) 0 0/200% 100%;animation:shim 1.2s linear infinite}
.skl{display:block;height:12px;margin-top:9px;border-radius:6px}
.skl+.skl{width:40%}
.badge.on{animation:bounce .35s ease-out}
#det{animation:slidein .25s cubic-bezier(.2,.8,.2,1)}
#det.out{animation:slideout .2s ease-in forwards}
#dposter{animation:pop .4s .05s cubic-bezier(.2,.8,.2,1) backwards}
#dinfo>*,.rt{animation:pop .35s cubic-bezier(.2,.8,.2,1) backwards}
#det h1,#dmeta,#dplay{animation:pop .4s .1s cubic-bezier(.2,.8,.2,1) backwards}
#dposter.loading{animation:pop .4s .05s cubic-bezier(.2,.8,.2,1) backwards,shim 1.2s linear infinite}
#det.loading #dplay{opacity:1;color:transparent;animation:pop .4s .1s cubic-bezier(.2,.8,.2,1) backwards,shim 1.2s linear infinite}
.ep.anim{animation:pop .3s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * 18ms)}
.chip{transition:background .2s,color .2s}
#pl,.sheet{animation:rise .3s cubic-bezier(.2,.8,.2,1)}
.sheet.out{animation:sink .22s ease-in forwards}
@keyframes sink{to{transform:translateY(100%)}}
.dev{animation:pop .3s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * 40ms)}
#pl:not(.open) #full{display:none}
#shade.out{animation:fadeout .2s forwards}
#pl.pending #thumb{animation:pulse 1.2s ease-in-out infinite}
/* While switching, the controls would still describe the previous movie. */
/* While switching the controls are there, but dimmed and dead. */
#pl.pending .live,#pl.pending #tg,#pl.pending #more,#pl.pending #spd{opacity:.4;pointer-events:none}
#spd.off{display:none}
#optbody{transition:opacity .2s}
#opts.pending #optbody{opacity:.45}
#prog div{transition:width .3s linear}
svg.spring{animation:spring .3s ease-out}
#toast{animation:tin .25s cubic-bezier(.2,.8,.2,1)}
/* desktop: a centered column and floating panels instead of edge-to-edge */
@media (min-width:900px){
  :root{--gut:max(32px,calc((100vw - 1180px) / 2));--dgut:max(40px,calc((100vw - 980px) / 2))}
  header{justify-content:center;padding:20px var(--gut) 16px}
  #f{max-width:640px}
  #grid{grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:28px 22px;padding:8px var(--gut) 140px}
  #rtitle{padding:8px var(--gut) 14px;font-size:20px}
  .card b{font-size:15px}
  #det .top{padding:24px var(--dgut) 36px}
  #det .hero{gap:28px}
  #dposter{width:210px;border-radius:14px}
  #det h1{font-size:34px}
  #dmeta{font-size:15px}
  #dplay{width:auto;min-width:260px;margin-top:24px}
  #dfrom0{width:auto;min-width:260px}
  #dinfo{padding:8px var(--dgut) 4px}
  #ddesc{max-width:760px;-webkit-line-clamp:6;font-size:16px}
  #seasons{flex-wrap:wrap;padding:20px var(--dgut) 10px}
  #eps{padding:0 var(--dgut)}
  #pl,.sheet{margin:0 auto;bottom:16px;border-radius:20px}
  #pl{width:min(560px,calc(100% - 32px));padding-bottom:12px}
  .sheet{width:min(480px,calc(100% - 32px));padding-bottom:16px}
  #toast{bottom:112px}
}
@media (hover:hover){
  .card img{transition:opacity .35s,transform .2s,filter .2s}
  .card:hover img{transform:translateY(-3px);filter:brightness(1.12)}
  .ep:hover,.dev:hover:not(:disabled){background:var(--s1)}
  .chip:hover:not(.on),.pill:hover:not(.ac),.ib:hover{filter:brightness(1.25)}
  .pill.ac:hover{filter:brightness(1.08)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>

<svg hidden>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm15 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zm10-12v12h2V6h-2z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></symbol>

  <symbol id="i-list" viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></symbol>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let token = localStorage.token || '', st = null, statusAt = 0, drag = null, busy = false, toastTimer;
let pending = null;     // play request in flight; status polls are ignored meanwhile
let asking = null;      // the first start of a title, while its sources load
let item = null;        // movie or series shown on the details page
let season = null;
let pollError = '';
const titles = {};      // /title answers by id
const layers = [];      // open overlays; the back button closes the last one
let device = localStorage.device || ''; // chosen Chromecast id; '' = BFF default
let devices = null;     // last /devices answer
let subStyle = JSON.parse(localStorage.subs || 'null'); // { size, bg } or null = receiver default
localStorage.removeItem('subStyle'); // older format with colors
const SHEETS = { opt: 'opts', dev: 'devs', sty: 'sty', src: 'srcs' }; // layer name -> bottom sheet
let recent = [];        // /progress list: recently watched titles, latest first
let searching = 0;      // number of the search shown; 0 = the recent titles are
let query = '';         // query of the search shown
localStorage.removeItem('last'); // searches are no longer restored
localStorage.removeItem('q');

// Requests that talk to the TV carry the chosen device.
const withDevice = path => device ? path + (path.includes('?') ? '&' : '?') + 'device=' + encodeURIComponent(device) : path;

async function api(path, body) {
  const o = { headers: {} };
  if (token) o.headers['X-Token'] = token;
  if (body) {
    o.method = 'POST';
    o.headers['Content-Type'] = 'application/json';
    o.body = JSON.stringify(body);
  }
  const r = await fetch('/api/' + path, o); // pages live at /title/… too
  const j = await r.json().catch(() => ({ error: r.statusText }));
  if (r.status == 401 && (token = prompt('Токен доступа') || '')) {
    localStorage.token = token;
    return api(path, body);
  }
  if (!r.ok) throw Object.assign(new Error(j.error || r.status), { body: j });
  return j;
}

function toast(e) {
  $('toast').textContent = '';
  void $('toast').offsetWidth; // restart the entry animation
  $('toast').textContent = e.message || e;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').textContent = '', 4000);
}

function fmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = String(s % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${x}` : `${m}:${x}`;
}

function el(tag, props, ...kids) {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...kids);
  return e;
}

// Swaps an icon; a changed icon gets a short spring animation.
function icon(id, name) {
  const use = $(id).querySelector('use'), href = '#i-' + name;
  if (use.getAttribute('href') == href) return;
  use.setAttribute('href', href);
  const svg = use.parentNode;
  svg.classList.remove('spring');
  void svg.offsetWidth;
  svg.classList.add('spring');
}

// Plays the element's "out" animation, then hides it. Children's animations
// bubble up, and reopening cancels the exit by dropping the class.
function animateOut(e) {
  if (e.hidden) return;
  e.classList.add('out');
  const end = ev => {
    if (ev.target != e) return;
    e.removeEventListener('animationend', end);
    if (!e.classList.contains('out')) return;
    e.classList.remove('out');
    e.hidden = true;
  };
  e.addEventListener('animationend', end);
}
const epShort = n => `${n.season}s${n.episode}e`; // 7 сезон 17 серия -> 7s17e
const note = text => $('msg').lastChild.textContent = text;

// ---- overlays and the back button ----------------------------------------

// Every overlay is a history entry; the entry knows how many are open, so
// back and forward can tell which to close. url: the address of the
// overlay, if it has its own.
function openLayer(name, url) {
  if (backs) return afterBack.push(() => openLayer(name, url));
  if (layers.includes(name)) return;
  layers.push(name);
  history.pushState({ depth: layers.length }, '', url);
  showLayer(name, true);
}

function showLayer(name, on) {
  const show = e => {
    e.classList.remove('out');
    e.hidden = false;
  };
  const e = $(name == 'det' ? 'det' : 'shade');
  // The shade is shared by the player and the device picker.
  if (on) show(e);
  else if (name == 'det' || !layers.some(l => l == 'pl' || l in SHEETS)) animateOut(e);
  if (name in SHEETS) on ? show($(SHEETS[name])) : animateOut($(SHEETS[name]));
  $('shade').classList.toggle('top', layers.some(l => l in SHEETS));
  if (name == 'pl') {
    foldPlayer(on);
    $('full').inert = !on || !!pending;
  }
}

// Opens the mini player into the full one and back. The panel slides
// instead of changing its height: a height transition lays out and repaints
// the page under it on every frame. The bar keeps its place on screen, the
// controls slide in and out below it, past the bottom edge. Everything that
// differs between the two goes along with the slide: the panel's background
// uncovers the handle above the bar, so its top edge with the progress line
// on it moves without a jump, the poster grows, the buttons swap. Below the
// bar the panel is cut where the mini player ends: on a desktop it floats
// above the bottom edge, and the controls would show under it. The cut stays
// put on the panel while what is in it slides: a cut animated along with the
// slide lags it on iOS, the slide running apart from the page, and the edge
// rose off the bottom showing the page under it.
let slide = [];
function foldPlayer(open) {
  const p = $('pl'), t = $('title').parentNode, box = e => e.getBoundingClientRect();
  const from = box($('bar')).top; // mid-slide too
  slide.forEach(a => a.cancel());
  const lay = on => {
    p.classList.toggle('open', on);
    return { y: box($('bar')).top, edge: box(p).top, w: box($('thumb')).width, x: box(t).left };
  };
  const m = lay(false), f = lay(true);
  // The buttons of the other state are on screen while fading, not to be hit.
  $('collapse').hidden = $('more').hidden = $('spd').hidden = false;
  $('collapse').inert = $('more').inert = $('spd').inert = !open;
  $('tg').inert = open;
  const done = () => {
    p.classList.toggle('open', open);
    $('collapse').hidden = $('more').hidden = $('spd').hidden = !open;
    p.style.clipPath = '';
  };
  if (p.hidden || m.y == f.y || matchMedia('(prefers-reduced-motion:reduce)').matches) return done();
  const k = (from - f.y) / (m.y - f.y), to = open ? 0 : 1; // 0 open, 1 mini
  const gap = (f.y - f.edge) - (m.y - m.edge), s = f.w ? m.w / f.w : 1;
  const r = getComputedStyle(p).borderBottomLeftRadius;
  const opt = { duration: 320, easing: 'cubic-bezier(.2,.8,.2,1)' };
  const go = (e, at) => e.animate([at(k), at(to)], opt);
  // Room above for the shadow.
  p.style.clipPath = `inset(-60px 0 0 round 0 0 ${r} ${r})`;
  slide = [
    ...[...p.children].map(e => go(e, k => ({ translate: `0 ${k * (m.y - f.y)}px` }))),
    // Gone by the middle of the slide: it shows under the bar till the end.
    $('full').animate([
      { opacity: Math.max(0, 1 - 2 * k) },
      ...(k - .5) * (to - .5) < 0 ? [{ opacity: 0, offset: (.5 - k) / (to - k) }] : [],
      { opacity: Math.max(0, 1 - 2 * to) },
    ], opt),
    go($('plbg'), k => ({ transform: `translateY(${k * gap}px)` })),
    go($('handle'), k => ({ opacity: 1 - k })),
    go($('prog'), k => ({ opacity: k })),
    go($('thumb'), k => ({ transform: `scale(${1 - k * (1 - s)})` })),
    go(t, k => ({ transform: `translateX(${k * (m.x - f.x)}px)` })),
    go($('tg'), k => ({ opacity: k, transform: `scale(${.6 + .4 * k})`, visibility: 'visible' })),
    ...[$('spd'), $('more'), $('collapse')].map(e => go(e, k => ({ opacity: 1 - k, transform: `scale(${1 - .4 * k})` }))),
  ];
  const a = slide[0];
  a.onfinish = () => {
    if (slide[0] != a) return;
    slide = [];
    done();
  };
}

// Closes the topmost overlay, and steps back in history so the back button
// stays in sync. The overlay goes at once: browsers report the step back
// late, iOS Safari about half a second. Overlays opened meanwhile wait for
// it, or the late step would close them; resolves once history caught up.
let backs = 0, afterBack = []; // steps asked for and not reported; who waits
const closeTop = () => new Promise(r => {
  if (!layers.length) return r();
  closeLayer();
  backs++;
  afterBack.push(r);
  history.back();
});

// Closes the player along with the sheets opened over it.
let closingPlayer = null;
const closePlayer = () => closingPlayer ||= (async () => {
  while (layers.includes('pl')) await closeTop();
  closingPlayer = null;
})();

function closeLayer() {
  const name = layers.pop();
  showLayer(name, false);
  if (name == 'det') {
    item = null;
    loadRecent(); // what was just watched moves to the front
  }
}

// ---- addresses ----------------------------------------------------------
//
// / is the watch history, /search?q=<query> a search, /title/<id> a title's
// page over either of them.

const titleUrl = id => '/title/' + encodeURIComponent(id);
const searchUrl = q => '/search?q=' + encodeURIComponent(q);
const urlTitle = () => /^\/title\/([^/]+)$/.exec(location.pathname)?.[1];
const urlQuery = () => location.pathname == '/search' && new URLSearchParams(location.search).get('q') || '';

// Brings the page in line with the address and the history entry: after
// back and forward, and on load.
function route() {
  // closeTop has closed the overlays already; the steps it took on the
  // way back would bring them back.
  const caughtUp = backs > 0;
  if (caughtUp && --backs) return;
  const depth = history.state?.depth || 0, id = urlTitle();
  while (layers.length > depth) closeLayer();
  // Forward to a title, or a reload, leaves the page to open again.
  if (!id && layers.includes('det')) while (layers.length) closeLayer();
  if (id && !layers.includes('det')) {
    while (layers.length) closeLayer();
    layers.push('det');
    showLayer('det', true);
  }
  if (id && item?.id != decodeURIComponent(id)) openDetails({ id: decodeURIComponent(id) });
  // Overlays forward of here are not brought back.
  if (depth != layers.length) history.replaceState({ ...history.state, depth: layers.length }, '');
  const q = urlQuery();
  if (q && q != query) {
    $('q').value = q;
    $('qx').hidden = false;
    search(q);
  } else if (!q && searching) showRecent();
  if (caughtUp) afterBack.splice(0).forEach(f => f());
}
window.addEventListener('popstate', route);

// ---- search -------------------------------------------------------------

function renderResults(results) {
  $('msg').hidden = results.length > 0;
  note('Ничего не найдено');
  $('grid').replaceChildren(...results.map((m, i) => {
    const b = el('button', { className: 'card' }, poster(m), el('b', {}, m.title), el('span', {}, m.year));
    b.style.setProperty('--i', i);
    b.dataset.id = m.id;
    b.onclick = () => openDetails(m);
    return b;
  }));
  markPlaying();
}

// Poster of a card, with a placeholder for titles without one or when it
// fails to load.
function poster(m) {
  const ph = () => el('i', {}, (m.title || '?')[0]);
  const img = m.poster
    ? el('img', { src: m.poster, alt: '', loading: 'lazy', referrerPolicy: 'no-referrer' })
    : ph();
  img.onerror = () => img.replaceWith(ph());
  img.onload = () => img.classList.add('ld');
  return img;
}

// ---- recently watched ---------------------------------------------------
//
// The main page lists the watch history until something is searched for;
// clearing the query brings it back.

async function loadRecent() {
  try {
    recent = (await api('progress')).recent;
  } catch {
    return; // the list is a convenience; search still works
  }
  if (!searching) renderRecent();
}

// "7s17e" for a series, plus "просмотрено" once the episode is watched or
// left past 90 % (the play button moves on to the next one). How far in
// shows on the poster.
function recentNote(r) {
  const done = r.done || r.season != null && r.dur && r.pos >= r.dur * 0.9;
  return [r.season != null ? epShort(r) : '', done ? 'просмотрено' : ''].filter(Boolean).join(' · ');
}

const recentPart = r => r.done ? 1 : r.dur ? Math.min(1, r.pos / r.dur) : 0;

function renderRecent() {
  $('rtitle').hidden = !recent.length;
  $('msg').hidden = recent.length > 0;
  note('Найдите фильм или сериал и запустите его на ТВ');
  $('grid').replaceChildren(...recent.map((r, i) => {
    const b = el('button', { className: 'card' },
      el('div', { className: 'pw' }, poster(r),
        el('div', { className: 'bar' }, el('div', { style: `width:${100 * recentPart(r)}%` }))),
      el('b', {}, r.title), el('span', {}, recentNote(r)));
    b.style.setProperty('--i', i);
    b.dataset.id = r.id;
    b.onclick = () => openDetails({ id: r.id, title: r.title, poster: r.poster });
    return b;
  }));
  markPlaying();
}

function showRecent() {
  searching = 0;
  query = '';
  $('q').value = '';
  $('qx').hidden = true;
  renderRecent();
}

// Marks the cards of whatever is on the TV now.
function markPlaying() {
  const id = st?.media && st.now?.id;
  for (const c of $('grid').children) {
    const b = c.querySelector('.badge.on');
    if (c.dataset.id == id && !b) c.append(el('span', { className: 'badge on' }, 'На ТВ'));
    if (c.dataset.id != id && b) b.remove();
  }
}

async function search(q) {
  const n = searching = Date.now();
  query = q;
  $('msg').hidden = $('rtitle').hidden = true;
  $('grid').replaceChildren(...Array.from({ length: 9 }, () =>
    el('div', {}, el('span', { className: 'sk' }), el('span', { className: 'skl' }), el('span', { className: 'skl' }))));
  try {
    const { results } = await api('search?q=' + encodeURIComponent(q));
    if (searching == n) renderResults(results); // not cleared or replaced meanwhile
  } catch (e) {
    if (searching != n) return;
    $('grid').replaceChildren();
    $('msg').hidden = false;
    note('Не удалось выполнить поиск');
    toast(e);
  }
}

// ---- details page -------------------------------------------------------

async function title(id) {
  return titles[id] ??= await api('title?id=' + encodeURIComponent(id));
}

const RATINGS = { kinopoisk: 'КП', imdb: 'IMDb' };
const duration = s => !s ? '' : (s >= 3600 ? Math.floor(s / 3600) + ' ч ' : '') + Math.round(s % 3600 / 60) + ' мин';

function renderInfo(t) {
  $('dmeta').replaceChildren(
    ...(t.original && t.original != t.title ? [el('div', { className: 'orig' }, t.original)] : []),
    el('div', {}, [t.year, t.countries.slice(0, 2).join(', '), t.type == 'series' ? 'Сериал' : duration(t.duration)].filter(Boolean).join(' · ')),
    ...(t.ratings.length ? [el('div', { className: 'rt' }, ...t.ratings.map(r =>
      el('span', {}, (RATINGS[r.source] || r.source) + ' ', el('b', {}, r.value.toFixed(1)))))] : []));
  const facts = [['Жанр', t.genres.slice(0, 4)], ['Режиссёр', t.directors.slice(0, 2)], ['В ролях', t.actors.slice(0, 6)]]
    .filter(([, v]) => v.length);
  const desc = el('p', { id: 'ddesc' }, t.description || '');
  desc.onclick = () => desc.classList.toggle('full');
  $('dinfo').replaceChildren(...(t.description ? [desc] : []),
    el('div', { className: 'facts' }, ...facts.map(([k, v]) => el('div', {}, el('b', {}, k + ': '), v.join(', ')))));
}

// Placeholder lines of the given widths, in %.
const skl = w => el('span', { className: 'skl', style: `width:${w}%` });
const sklLines = (...ws) => ws.map(w => el('div', {}, skl(w)));

// Without a picture an img gets a frame from the browser; a blank one has none.
const BLANK = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
$('dposter').onload = $('dposter').onerror = e => {
  if (e.target.getAttribute('src') != BLANK) e.target.classList.remove('loading');
};

// m comes from search results (id, title, year, poster); whether it is a movie
// or a series is only known once /title answers. Until then the page shows
// placeholders where its parts will be; opened by its address it knows only the id.
async function openDetails(m) {
  item = m;
  $('det').classList.add('loading');
  $('dtitle').replaceChildren(m.title || skl(70));
  $('dmeta').replaceChildren(...sklLines(55), el('div', { className: 'rt' }, el('span', { className: 'skl' }), el('span', { className: 'skl' })));
  const showPoster = p => {
    $('dposter').src = p || BLANK;

  };
  showPoster(m.poster);
  $('dposter').hidden = false;
  $('dplay').hidden = false;
  $('dplay').disabled = true;
  $('dplay').lastChild.textContent = 'Смотреть на ТВ'; // the width of the button on desktop
  $('dfrom0').hidden = true;
  $('seasons').replaceChildren();
  $('eps').replaceChildren();
  $('dinfo').replaceChildren(el('p', { id: 'ddesc' }, ...sklLines(100, 100, 100, 70)),
    el('div', { className: 'facts' }, ...sklLines(45, 35, 85)));
  // The blurred backdrop overflows .top; older engines can still scroll it.
  $('det').scrollTop = $('det').firstElementChild.scrollTop = 0;
  // From the player the page may already be open with another title.
  if (!layers.includes('det')) openLayer('det', titleUrl(m.id));
  else if (urlTitle() != encodeURIComponent(m.id)) history.replaceState(history.state, '', titleUrl(m.id));
  // Watch progress changes between visits, so unlike /title it isn't cached.
  const prog = api('progress?id=' + encodeURIComponent(m.id)).catch(() => ({}));
  let t;
  try {
    t = await title(m.id);
    ({ progress: m.progress = null, prefs: m.prefs = null } = await prog);
  } catch (e) {
    if (item == m) {
      $('det').classList.remove('loading');
      $('dtitle').textContent = m.title || '';
      $('dmeta').textContent = m.year || '';
      $('dposter').hidden = !m.poster;
      $('dplay').hidden = true;
      $('dinfo').replaceChildren(el('p', { className: 'note' }, 'Не удалось загрузить'));
    }
    return toast(e);
  }

}

// The episode to go on with and where: the last one watched, or the one
// after it from the start once that is watched or left past 90 %.
function continueAt(m) {
  const last = m.progress?.last;
  if (!last) return null;
  const all = m.seasons.flatMap(s => s.episodes.map(e => ({ season: s.season, episode: e.episode })));
  const i = all.findIndex(e => e.season == last.season && e.episode == last.episode);
  if (i < 0) return null;
  const p = m.progress.eps[epKey(last)];
  if (p?.done || p?.dur && p.pos >= p.dur * 0.9)
    return all[i + 1] ? { ...all[i + 1], resume: 0, start: 0 } : null;
  return { ...all[i], resume: p?.pos > 10 ? p.pos : 0 };
}
const epKey = e => `${e.season}:${e.episode}`;

// What the play button starts: a movie where it was left off, a series'
// episode from continueAt or else the first one.
function playTarget(m) {
  const base = { id: m.id, title: m.title, poster: m.poster };
  if (m.type == 'movie') {
    const p = m.progress;
    return { ...base, resume: p && !p.done && p.pos > 10 ? p.pos : 0 };
  }
  const first = m.seasons?.find(s => s.episodes.length);
  const c = continueAt(m) || first && { season: first.season, episode: first.episodes[0].episode, resume: 0 };
  return c && { ...base, ...c };
}

// Play button; offers the player instead when the title is already on.
function renderDetails() {
  if (!item?.type) return;
  const on = st?.media && st.now?.id == item.id;
  const starting = pending?.id == item.id || asking?.id == item.id;
  const t = playTarget(item);
  $('dplay').hidden = !t;
  if (!t) return;
  const series = t.season != null;
  $('dplay').lastChild.textContent = starting ? 'Запускаю…' : on ? 'Уже на ТВ — открыть плеер' :
    series ? `${t.season} сезон, ${t.episode} серия` + (t.resume ? ', ' + fmt(t.resume) : '') :
    t.resume ? 'Продолжить с ' + fmt(t.resume) : 'Смотреть на ТВ';
  $('dplay').disabled = $('dfrom0').disabled = !!pending || !!asking;
  $('dfrom0').hidden = !t.resume || on || starting || t.season != null; // movies only
}

function showSeason(s) {
  season = s;
  if (!s) return $('eps').replaceChildren(el('p', { className: 'note' }, 'Серий нет'));
  $('seasons').replaceChildren(...item.seasons.map(x => {
    const c = el('button', { className: 'chip' + (x == s ? ' on' : '') }, `${x.season} сезон`);
    c.onclick = () => showSeason(x);
    return c;
  }));
  $('seasons').querySelector('.on')?.scrollIntoView({ inline: 'center', block: 'nearest' });
  renderEpisodes(true);
}

// Called on every status poll; rebuilds the list only when the highlighted
// episode or the progress changes so a tap in progress isn't lost.
function renderEpisodes(force) {
  if (!item?.seasons || !season) return;
  const now = pending || (st?.media && st.now);
  const key = `${item.id}|${season.season}|${now?.id}|${now?.season}|${now?.episode}|${!!pending}|${JSON.stringify(item.progress)}`;
  if (!force && $('eps').dataset.key == key) return;
  $('eps').dataset.key = key;
  const m = item, sn = season.season, cont = continueAt(m);
  $('eps').replaceChildren(...season.episodes.map((e, i) => {
    const on = now?.id == m.id && now.season == sn && now.episode == e.episode;
    const p = m.progress?.eps?.[epKey({ season: sn, episode: e.episode })];
    const part = p && !p.done && p.pos > 10 && p.dur ? p.pos / p.dur : 0;
    const next = !on && cont?.season == sn && cont.episode == e.episode;
    // Provider titles are usually just "<series> (N сезон) - M серия".
    const generic = !e.title || /серия\s*$/i.test(e.title);
    const b = el('button', { className: 'ep' + (on ? ' on' : '') + (p?.done ? ' done' : '') + (next ? ' cont' : '') + (force ? ' anim' : '') },
      ...(generic ? [el('span', {}, `${e.episode} серия`)] : [el('b', {}, e.episode), el('span', {}, e.title)]),
      el('small', {}, on ? (pending ? 'запуск…' : 'на ТВ') :
        part ? (next ? 'продолжить · ' : '') + 'ещё ' + Math.ceil((p.dur - p.pos) / 60) + ' мин' :
        next ? 'следующая' : p?.done ? 'просмотрено' :
        e.duration ? Math.round(e.duration / 60) + ' мин' : ''),
      ...(part && !on ? [el('i', { className: 'pb', style: `width:${100 * part}%` })] : []));
    b.style.setProperty('--i', i);
    b.onclick = () => start({ id: m.id, title: m.title, poster: m.poster, season: sn, episode: e.episode });
    return b;
  }));
}

$('dplay').onclick = () => {
  if (st?.media && st.now?.id == item.id) return openLayer('pl');
  start(playTarget(item)); // without start the router resumes where it was left off
};
$('dfrom0').onclick = () => start({ ...playTarget(item), start: 0 });
$('dback').onclick = closeTop;

// ---- playback -----------------------------------------------------------

// m: { id, title, poster } plus season and episode for a series episode.
async function play(m) {
  if (pending) return;
  const req = { id: m.id, title: m.title };
  if (m.poster) req.poster = m.poster;
  // Quality switches replay the same stream from the current position.
  for (const k of ['stream', 'start', 'rate', 'audio', 'subs', 'reuse'])
    if (m[k] != null) req[k] = String(m[k]);
  const quality = m.quality ?? localStorage.quality;
  if (quality) req.quality = quality;
  if (m.source) req.source = m.source; // without it the router takes the main player
  const drc = m.drc ?? localStorage.drc; // the router ignores it where it can't level
  if (drc) req.drc = String(drc);
  req.autonext = localStorage.autonext || '1'; // on unless turned off
  req.style = styleSpec(subStyle || {}); // the receiver resets it on every load
  if (m.season != null) Object.assign(req, { season: String(m.season), episode: m.episode });
  pending = req;
  refresh();
  try {
    const s = await api(withDevice('play'), req);
    pending = null;
    const moved = otherEpisode(s); // then render reloads it
    render(s);
    if (!moved) reloadProgress(m.id);
  } catch (e) {
    pending = null;
    refresh();
    // Sources are resolved one at a time; when the chosen one is rejected,
    // offer the others instead of failing outright.
    const { source: bad, sources } = e.body || {};
    if (sources?.some(n => n != bad)) {
      openLayer('src');
      showSources(m, sources, bad);
    } else toast('Не удалось запустить: ' + e.message);
  }
}

// The details page stays open; the router may have just marked the
// previous episode watched.
async function reloadProgress(id) {
  loadRecent();
  if (item?.id != id) return;
  const shown = item;
  const { progress, prefs } = await api('progress?id=' + encodeURIComponent(id)).catch(() => ({}));
  if (item == shown && progress !== undefined) {
    item.progress = progress;
    item.prefs = prefs;
    renderDetails();
    renderEpisodes();
  }
}

// The first start of a title from the details page asks for the source;
// later ones go on with the source, quality, dub and subtitles it was
// watched with, which the router remembers. Another source is picked in
// the player settings.
async function start(m) {
  arm(); // still inside the tap
  if (asking) return;
  if (m.source || pending || item?.id != m.id || item.prefs?.source) return play(m);
  asking = m;
  renderDetails();
  let names = [];
  try {
    const q = m.season != null ? `&season=${m.season}&episode=${encodeURIComponent(m.episode)}` : '';
    names = (await api(withDevice('streams?id=' + encodeURIComponent(m.id) + q))).streams.map(s => s.name);
  } catch {} // play tells what went wrong
  asking = null;
  renderDetails();
  if (item?.id != m.id) return;
  if (names.length < 2) return play(m);
  openLayer('src');
  showSources(m, names);
}

// bad: the source that just failed; without it the first start asks.
function showSources(m, names, bad) {
  $('srchead').textContent = bad ? 'Источник недоступен' : 'Выберите источник';
  $('srclist').replaceChildren(...names.map((n, i) => {
    const b = el('button', { className: 'dev', disabled: n == bad },
      el('span', {}, el('b', {}, n), n == bad ? el('small', {}, 'не открылся') : ''), el('i'));
    b.style.setProperty('--i', i);
    b.onclick = async () => {
      arm();
      await closeTop();
      play({ ...m, source: n });
    };
    return b;
  }));
}

// Plays the episode next to the current one (dir = 1 or -1), crossing
// season boundaries.
async function stepEpisode(dir) {
  const now = st?.now;
  if (now?.season == null) return;
  try {
    const { seasons } = await title(now.id);
    const si = seasons.findIndex(s => s.season == now.season);
    const eps = seasons[si]?.episodes || [];
    const ei = eps.findIndex(e => e.episode == now.episode);
    let s = seasons[si], e = eps[ei + dir];
    if (!e) {
      s = seasons[si + dir];
      e = s?.episodes.at(dir > 0 ? 0 : -1);
    }
    if (!e) return toast(dir > 0 ? 'Это последняя серия' : 'Это первая серия');
    play({ id: now.id, title: now.title, poster: now.poster, season: s.season, episode: e.episode, source: now.source });
  } catch (e) {
    toast(e);
  }
}

// Track lists change rarely; rebuild options only when they do, so an open
// <select> isn't reset by polling.
function fill(sel, tracks, off) {
  const opts = tracks.map(t => [t.id, (t.label || t.name || t.lang || t.id) + (t.lang ? ` (${t.lang})` : '')]);
  if (off) opts.unshift(['off', 'Выключены']);
  const key = JSON.stringify(opts);
  if (sel.dataset.key != key) {
    sel.dataset.key = key;
    sel.replaceChildren(...opts.map(([v, t]) => el('option', { value: v }, t)));
  }
  sel.closest('.sel').hidden = !tracks.length;
  const a = tracks.find(t => t.active);
  sel.value = a ? a.id : 'off';
}

// Status is polled every 2 s; while playing, the position in between is
// extrapolated locally so the timer ticks every second.
function showTime() {
  const m = st?.media;
  if (!m || pending) return;
  let t = m.time || 0;
  if (m.state == 'PLAYING') t += (Date.now() - statusAt) / 1000 * (m.rate || 1);
  if (m.duration) t = Math.min(t, m.duration);
  showStatus(st.now, m.state == 'BUFFERING', m.duration ? `${fmt(t)} / ${fmt(m.duration)}` : '');
  $('prog').firstChild.style.width = m.duration ? (100 * t / m.duration) + '%' : 0;
  if (drag != 'pos') showPos(t, m.duration);
}

// The line under the title: the episode of a series, and folded the time,
// or loading. Only texts and classes change on every tick: a re-created
// spinner would restart its animation and jerk instead of spinning.
function showStatus(n, busy, time) {
  const s = $('st'), ep = n?.season != null ? `${n.season} сез., ${n.episode} сер.` : '';
  $('stEp').textContent = ep;
  $('sttm').textContent = busy ? 'Загрузка…' : time;
  s.classList.toggle('sr', !!ep);
  s.classList.toggle('tm', busy || !!time);
  s.classList.toggle('busy', busy);
}

// Mini player; while a play request is in flight it shows that movie.
function renderBar() {
  const n = pending || st?.now;
  const m = st?.media;
  $('pl').hidden = !pending && !m;
  if ($('pl').hidden) {
    if (['pl', 'opt'].includes(layers.at(-1))) closePlayer();
    return;
  }
  $('title').textContent = n?.title || 'Chromecast';
  $('thumb').hidden = !n?.poster;
  if (n?.poster && $('thumb').getAttribute('src') != n.poster) $('thumb').src = n.poster;
  $('full').inert = !layers.includes('pl') || !!pending;
  $('pl').classList.toggle('pending', !!pending);
  // Settings switched there replay the stream; they wait for it as well.
  $('optbody').inert = !!pending;
  $('opts').classList.toggle('pending', !!pending);
  if (pending) {
    // The controls of what starts, not of what was on.
    showStatus(pending, true, '');
    $('prog').firstChild.style.width = 0;
    showPos(0, 0);
    icon('tg', 'play');
    icon('pp', 'play');
    showSpeed({ rate: +pending.rate || 1 });
    showSeries(pending.season != null);
    return;
  }
  const playing = m.state == 'PLAYING' || m.state == 'BUFFERING';
  icon('tg', playing ? 'pause' : 'play');
  icon('pp', playing ? 'pause' : 'play');
  showTime();
}

function refresh() {
  renderBar();
  syncSession();
  markPlaying();
  renderDetails();
  renderEpisodes();
}

// Another episode of the same series is on than the last one seen, e.g.
// the router started the next one itself (with nothing on in between).
let lastNow = null;
function otherEpisode(s) {
  const was = lastNow, n = s.now;
  return !!(was && n && n.id == was.id && (n.season != was.season || n.episode != was.episode));
}

// A series has the episode buttons around the play one.
function showSeries(series) {
  $('ctl').classList.toggle('series', series);
  for (const b of document.querySelectorAll('.ep-nav')) b.hidden = !series;
}

let autoArmed = false;
function render(s) {
  if (otherEpisode(s)) reloadProgress(s.now.id);
  if (s.now) lastNow = s.now;
  st = s;
  statusAt = Date.now();
  // Something is already on after a reload: try the widget right away. iOS
  // usually refuses without a tap, and then the first tap does it.
  if (!autoArmed && ['PLAYING', 'BUFFERING'].includes(s.media?.state)) {
    autoArmed = true;
    arm();
  }
  refresh();
  $('devname').lastChild.textContent = s.device?.name || '';
  $('devname').hidden = !s.device?.name || (devices?.devices.length ?? 0) < 2;
  const m = s.media;
  if (!m) return;
  const series = s.now?.season != null;
  $('eprow').hidden = !series;
  $('nextrow').hidden = !series;
  $('autonext').checked = !!s.now?.autonext;
  showSeries(series);
  if (drag != 'vol' && s.volume != null) showVol(s.volume * 100);
  icon('mu', s.muted ? 'mute' : 'vol');
  showSpeed(m);
  const tr = m.tracks || [];
  fill($('audio'), tr.filter(t => t.type == 'AUDIO'), false);
  fill($('subs'), tr.filter(t => t.type == 'TEXT'), true);
  // Variants come from the master playlist; the BFF trims it to the chosen one.
  const qs = s.now?.qualities || [], srcs = s.now?.sources || [];
  $('qsel').hidden = qs.length < 2;
  $('srcsel').hidden = srcs.length < 2;
  $('qrow').hidden = $('qsel').hidden && $('srcsel').hidden;
  const options = (sel, opts) => {
    if (sel.dataset.key == JSON.stringify(opts)) return;
    sel.dataset.key = JSON.stringify(opts);
    sel.replaceChildren(...opts.map(([v, t]) => el('option', { value: v }, t)));
  };
  options($('quality'), [...qs.map(q => [q, q]), ['auto', 'Авто']]);
  options($('source'), srcs.map(n => [n, n]));
  $('quality').value = s.now?.quality || 'auto';
  if (s.now?.source) $('source').value = s.now.source;
  // Only sources whose audio the router can level offer the switch.
  $('drcrow').hidden = !s.now?.drc_ok;
  $('drc').checked = !!s.now?.drc;
}

// Where playback is now, extrapolated from the last status.
const position = m => (m.time || 0) + (m.state == 'PLAYING' ? (Date.now() - statusAt) / 1000 * (m.rate || 1) : 0);

// Repeated ±10 taps move the timer right away and add up into one seek sent
// once the tapping stops; polled status would undo them until then.
let seekTimer = null;
function skip(delta) {
  const m = st?.media;
  if (!m) return;
  m.time = Math.max(0, Math.min(position(m) + delta, m.duration || Infinity));
  statusAt = Date.now();
  showTime();
  syncSession();
  clearTimeout(seekTimer);
  seekTimer = setTimeout(() => {
    seekTimer = null;
    cmd('seek', position(m).toFixed(1));
  }, 600);
}

let cmdAt = 0; // polls sent before a command may report the old state
let inflight = 0; // commands still on their way to the TV
async function cmd(c, arg) {
  cmdAt = Date.now();
  inflight++;
  const m = st?.media;
  if (c == 'toggle') {
    c = m?.state == 'PAUSED' ? 'resume' : 'pause';
    // Flip the icon right away; the receiver takes a moment to answer.
    if (m) {
      m.time = position(m);
      statusAt = Date.now();
      m.state = c == 'pause' ? 'PAUSED' : 'PLAYING';
      render(st);
    }
  }
  if (c == 'mute' && st?.muted) c = 'unmute';
  try {
    render(await api(withDevice('cmd'), arg == null ? { c } : { c, arg: String(arg) }));
  } catch (e) {
    toast(e);
    poll();
  } finally {
    inflight--;
    syncSession();
  }
}

async function poll() {
  // In the background only a lock screen widget needs the status.
  if (busy || document.hidden && keep.paused) return;
  busy = true;
  try {
    const sent = device, at = Date.now();
    const s = await api(withDevice('status'));
    pollError = '';
    if (!pending && !seekTimer && sent == device && at > cmdAt) render(s);
  } catch (e) {
    if (e.message == 'device not found' && device) {
      // The saved TV is gone; fall back to the default one.
      toast('Устройство не найдено, переключаюсь на другое');
      selectDevice('');
      busy = false;
      return;
    }
    // Report a lost connection once, not on every poll.
    if (e.message != pollError) toast('Нет связи с ТВ: ' + e.message);
    pollError = e.message;
  }
  busy = false;
}

// ---- lock screen controls -----------------------------------------------

// iOS shows the Now Playing widget only while the page itself plays
// something, so a silent loop stands in for the TV. Only the widget's
// buttons control the TV: another app taking over the audio pauses the loop,
// and the TV must keep playing.
// 16-bit PCM WAV as a data: URL; a ±1 LSB noise instead of pure zeros, in
// case iOS skips digital silence. Inaudible either way.
function silence(sec) {
  const rate = 8000, n = rate * sec, b = new DataView(new ArrayBuffer(44 + 2 * n));
  const str = (o, t) => [...t].forEach((c, i) => b.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); b.setUint32(4, 36 + 2 * n, true); str(8, 'WAVEfmt ');
  b.setUint32(16, 16, true); b.setUint16(20, 1, true); b.setUint16(22, 1, true); // PCM, mono
  b.setUint32(24, rate, true); b.setUint32(28, 2 * rate, true); b.setUint16(32, 2, true); b.setUint16(34, 16, true);
  str(36, 'data'); b.setUint32(40, 2 * n, true);
  for (let i = 0; i < n; i++) b.setInt16(44 + 2 * i, i & 1 ? 1 : -1, true);
  let bin = '';
  const u = new Uint8Array(b.buffer);
  for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode(...u.subarray(i, i + 0x8000));
  return 'data:audio/wav;base64,' + btoa(bin);
}
const keep = new Audio();
keep.loop = true;
let keepSrc = null, session = false, sessionKey = '';

// Starts the loop; called from taps, which iOS requires for playing.
function arm() {
  session = true;
  if (!keep.paused) return;
  if (!keep.src) keep.src = keepSrc ||= silence(30);
  keep.play().catch(() => {});
}

function syncSession() {
  const ms = navigator.mediaSession;
  const n = pending || st?.now, m = st?.media;
  if (st && !m && !pending) {
    // Nothing on the TV: drop the widget.
    if (session || keep.src) {
      session = false;
      sessionKey = '';
      keep.pause();
      keep.removeAttribute('src');
      keep.load();
      if (ms) ms.metadata = null;
    }
    return;
  }
  if (!ms || !session) return;
  const key = JSON.stringify([n?.title, n?.season, n?.episode, n?.poster, st?.device?.name]);
  if (key != sessionKey) {
    sessionKey = key;
    ms.metadata = new MediaMetadata({
      title: n?.title || 'Chromecast',
      artist: n?.season != null ? `${n.season} сезон, ${n.episode} серия` : st?.device?.name || '',
      artwork: n?.poster ? [{ src: n.poster }] : [],
    });
  }
  if (pending || !m) return;
  // The loop follows a pause on the TV but never restarts by itself: that
  // would take the audio back from whatever app has it now. It stops only
  // once the command is through: a long backgrounded page that stops playing
  // is frozen at once, and the request would never leave the phone.
  const stopped = m.state == 'PAUSED' || m.state == 'IDLE';
  if (stopped && !inflight) keep.pause();
  ms.playbackState = keep.paused || stopped ? 'paused' : 'playing';
  syncPosition();
}

function syncPosition() {
  const m = st?.media;
  if (!session || pending || !m?.duration) return;
  try {
    navigator.mediaSession?.setPositionState({ duration: m.duration, position: Math.min(position(m), m.duration), playbackRate: m.rate || 1 });
  } catch {}
}
// When the loop wraps, iOS briefly shows the loop's own position; putting
// the TV's back on every tick keeps the widget from jumping to zero.
keep.ontimeupdate = keep.onseeked = syncPosition;

if (navigator.mediaSession) {
  const ms = navigator.mediaSession, playing = () => ['PLAYING', 'BUFFERING'].includes(st?.media?.state);
  const on = (a, f) => { try { ms.setActionHandler(a, f); } catch {} };
  // After an interruption the widget shows a pause while the TV plays; play
  // then just brings the loop back.
  on('play', () => {
    arm();
    if (st?.media?.state == 'PAUSED') cmd('toggle');
    else syncSession();
  });
  on('pause', () => {
    if (playing()) cmd('toggle');
    else keep.pause(), syncSession();
  });
  on('seekbackward', d => skip(-(d.seekOffset || 10)));
  on('seekforward', d => skip(d.seekOffset || 10));
  on('seekto', d => {
    const m = st?.media;
    if (!m || d.seekTime == null) return;
    clearTimeout(seekTimer);
    seekTimer = null;
    m.time = d.seekTime;
    statusAt = Date.now();
    showTime();
    cmd('seek', d.seekTime.toFixed(1));
  });
}

// Any tap starts the loop while the TV has something on, so the widget is
// there after a reload too; iOS plays nothing without a tap. Stopping and
// a TV with nothing on are left alone, not to cut off other apps' audio.
const tapArm = e => { if (st?.media && !e.target.closest?.('#stop')) arm(); };
document.addEventListener('click', tapArm, true);
document.addEventListener('touchend', tapArm, true);
// Coming back after another app took the audio brings the widget back.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && session && keep.paused && ['PLAYING', 'BUFFERING'].includes(st?.media?.state)) arm();
});

// ---- devices ------------------------------------------------------------

const currentDevice = () => device || st?.device?.id || devices?.default || '';

function renderDevices() {
  const list = devices?.devices || [];
  $('devbtn').classList.toggle('on', list.length > 1);
  if ($('devs').hidden) return;
  const cur = currentDevice();
  $('devlist').replaceChildren(...list.map((d, i) => {
    const b = el('button', { className: 'dev' + (d.id == cur ? ' on' : '') },
      el('span', {}, el('b', {}, d.name || d.host), el('small', {}, [d.model, d.host].filter(Boolean).join(' · '))), el('i'));
    b.prepend(document.querySelector('#devbtn svg').cloneNode(true));
    b.style.setProperty('--i', i);
    b.onclick = async () => {
      // The player may belong to the previous TV, so close it as well.
      while (layers.some(l => l == 'pl' || l in SHEETS)) await closeTop();
      selectDevice(d.id);
    };
    return b;
  }));
  if (!list.length) $('devlist').append(el('p', { className: 'note' }, 'Chromecast не найден в сети'));
}

async function loadDevices(rescan) {
  $('devscan').disabled = true;
  if (rescan) $('devscan').querySelector('svg').style.animation = 'spin .8s linear infinite';
  try {
    devices = await api('devices' + (rescan ? '?refresh=1' : ''));
  } catch (e) {
    toast(e);
  }
  $('devscan').disabled = false;
  $('devscan').querySelector('svg').style.animation = '';
  renderDevices();
}

function selectDevice(id) {
  if (id == currentDevice() && id == device) return;
  device = id;
  localStorage.device = id;
  st = null;
  refresh();
  renderDevices();
  poll();
}

// ---- subtitle style -----------------------------------------------------

// The receiver ignores colors and edges for side-loaded WebVTT, so only the
// size and the opacity of the black background behind the text are offered.
// The receiver ignores colors and edges for side-loaded WebVTT, so only the
// size, the opacity of the black background and the font are offered. Size
// and background stay at the receiver's defaults until changed; the font is
// always sent, since the receiver's default one is monospaced.
const FONTS = [['sans', 'Обычный', 'system-ui,sans-serif'], ['mono', 'Моноширинный', 'ui-monospace,monospace']];
const styleSpec = s => [
  s.size != null && `size=${s.size}`,
  s.bg != null && 'bg=#000000' + Math.round(s.bg * 2.55).toString(16).padStart(2, '0').toUpperCase(),
  `font=${FONTS.some(f => f[0] == s.font) ? s.font : 'sans'}`,
].filter(Boolean).join(',');

// Preview and labels follow the sliders; the TV gets the value on release.
function renderStyle(s = subStyle || {}) {
  const size = s.size ?? 1, bg = s.bg ?? 0;
  const font = FONTS.some(f => f[0] == s.font) ? s.font : 'sans';
  $('stysize').value = size;
  $('stybg').value = bg;
  $('stysizev').textContent = Math.round(size * 100) + '%';
  $('stybgv').textContent = bg ? bg + '%' : 'нет';
  $('styfont').replaceChildren(...FONTS.map(([v, label]) => {
    const c = el('button', { className: 'chip' + (v == font ? ' on' : '') }, label);
    c.onclick = () => setStyle({ ...subStyle, font: v });
    return c;
  }));
  const pv = $('stypv').firstChild.style;
  pv.fontSize = 15 * size + 'px';
  pv.background = `rgba(0,0,0,${bg / 100})`;
  pv.fontFamily = FONTS.find(f => f[0] == font)[2];
  $('styreset').hidden = !subStyle;
}

// Sends the style to the TV now; it is also resent with every play.
function setStyle(s) {
  subStyle = s;
  if (s) localStorage.subs = JSON.stringify(s);
  else localStorage.removeItem('subs');
  renderStyle();
  if (st?.media) cmd('substyle', styleSpec(s || {}));
}

// ---- wiring -------------------------------------------------------------

$('f').onsubmit = e => {
  e.preventDefault();
  const q = $('q').value.trim();
  if (q.length < 3) return toast('Введите хотя бы 3 символа');
  $('q').blur();
  // The first search is a step back from the history; the next ones replace it.
  if (q == query); // a retry
  else if (searching) history.replaceState(history.state, '', searchUrl(q));
  else history.pushState({ depth: 0, search: 1 }, '', searchUrl(q));
  search(q);
};
// Back to the history: through back, if the search was entered here.
function clearSearch() {
  if (history.state?.search) history.back();
  else history.replaceState({ depth: 0 }, '', '/');
  showRecent();
}
document.querySelectorAll('[data-c]').forEach(b => b.onclick = e => {
  e.stopPropagation();
  const c = b.dataset.c;
  if (c == 'rew' || c == 'ff') skip(c == 'ff' ? +b.dataset.a : -b.dataset.a);
  else cmd(c, b.dataset.a);
});
$('bar').onclick = () => layers.at(-1) == 'pl' ? closeTop() : openLayer('pl');
$('collapse').onclick = e => {
  e.stopPropagation();
  closeTop();
};
$('more').onclick = e => {
  e.stopPropagation();
  openLayer('opt');
};
$('optcollapse').onclick = closeTop;
$('shade').onclick = closeTop;

// Playback speed: the button shows it, the browser's picker over it picks
// another. The Default Media Receiver refuses anything outside 0.5..2
// (INVALID_PARAMS).
const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
const speedLabel = r => +(+r).toFixed(2) + 'x';
function showSpeed(m) {
  const r = m.rate || 1;
  $('spd').classList.toggle('off', !!m.live);
  $('spd').classList.toggle('alt', r != 1);
  $('speed').textContent = speedLabel(r);
  $('spdsel').value = String(r);
}
$('spdsel').replaceChildren(...SPEEDS.map(r => el('option', { value: String(r) }, speedLabel(r))));
$('spd').onclick = e => e.stopPropagation();
$('spdsel').onchange = e => {
  const r = +e.target.value, m = st?.media;
  if (!m || r == (m.rate || 1)) return;
  // The position so far went at the old speed.
  m.time = position(m);
  statusAt = Date.now();
  m.rate = r;
  showSpeed(m);
  cmd('speed', r);
};

// Sliders: a drag anywhere moves the value from where it was by as much as
// the finger moves, not to under the finger; a mouse still jumps to the
// click. A tap alone changes nothing. start() gives the value and its
// maximum, or nothing when the slider can't be moved now; end() gets the
// new value, or null if there's none.
function slider(box, { start, show, end }) {
  let d = null;
  box.onpointerdown = e => {
    const v = start();
    if (!v) return;
    e.preventDefault();
    box.setPointerCapture(e.pointerId);
    const r = box.getBoundingClientRect();
    d = { ...v, x: e.clientX, w: r.width, moved: e.pointerType == 'mouse' };
    if (d.moved) d.v = Math.min(Math.max((e.clientX - r.left) / r.width * d.max, 0), d.max);
    box.classList.add('on');
    show(d.v, d.max);
  };
  box.onpointermove = e => {
    if (!d || e.clientX == d.x) return;
    d.v = Math.min(Math.max(d.v + (e.clientX - d.x) / d.w * d.max, 0), d.max);
    d.x = e.clientX;
    d.moved = true;
    show(d.v, d.max);
  };
  const stop = ok => {
    if (!d) return;
    const { v, moved } = d;
    d = null;
    box.classList.remove('on');
    end(ok && moved ? v : null);
  };
  box.onpointerup = () => stop(true);
  box.onpointercancel = () => stop(false);
}
const showLevel = (id, f) => $(id).firstChild.firstChild.style.width = 100 * Math.min(Math.max(f || 0, 0), 1) + '%';
function showPos(t, max) {
  showLevel('pos', max ? t / max : 0);
  $('cur').textContent = fmt(t);
  $('rem').textContent = max ? '−' + fmt(max - t) : '';
}
let volume = null;
const showVol = v => showLevel('vol', (volume = v) / 100);
slider($('pos'), {
  start() {
    const m = st?.media;
    if (!m?.duration || pending) return;
    drag = 'pos';
    return { v: Math.min(position(m), m.duration), max: m.duration };
  },
  show: showPos,
  end(v) {
    drag = null;
    if (v != null && st?.media) {
      clearTimeout(seekTimer); // the drag wins over pending ±10 taps
      seekTimer = null;
      st.media.time = Math.round(v);
      statusAt = Date.now();
      cmd('seek', Math.round(v));
    }
    showTime();
  },
});
slider($('vol'), {
  start() {
    if (volume == null) return;
    drag = 'vol';
    return { v: volume, max: 100 };
  },
  show: showVol,
  end(v) {
    drag = null;
    if (v == null) showVol(st?.volume != null ? st.volume * 100 : volume);
    else cmd('volume', Math.round(v));
  },
});
$('audio').onchange = e => cmd('audio', e.target.value);
$('subs').onchange = e => cmd('subs', e.target.value);
// Replays what is on from the current position with some settings changed.
function replay(changes) {
  const n = st?.now, m = st?.media;
  if (!n || !m) return;
  play({ id: n.id, title: n.title, poster: n.poster, season: n.season, episode: n.episode,
    source: n.source, quality: n.quality, start: position(m).toFixed(1), rate: m.rate, reuse: 1, ...changes });
}
const activeTrack = type => st?.media?.tracks?.find(t => t.type == type && t.active)?.name;
$('quality').onchange = e => {
  localStorage.quality = e.target.value;
  replay({ quality: e.target.value, audio: activeTrack('AUDIO'), subs: activeTrack('TEXT') || 'off' });
};
// The leveled audio is another stream for the TV, so it is replayed too.
$('drc').onchange = e => {
  localStorage.drc = e.target.checked ? '1' : '0';
  replay({ drc: localStorage.drc, audio: activeTrack('AUDIO'), subs: activeTrack('TEXT') || 'off' });
};
// The router starts the next episode itself, also with the page closed.
$('autonext').onchange = async e => {
  localStorage.autonext = e.target.checked ? '1' : '0';
  try {
    render(await api(withDevice('autonext'), { on: localStorage.autonext }));
  } catch (err) {
    toast(err);
  }
};
// Another source has its own tracks, so audio and subtitles start fresh.
$('source').onchange = e => {
  replay({ source: e.target.value, quality: localStorage.quality });
};
// The page of what is on, under the player.
async function openNow() {
  const n = st?.now;
  if (!n) return;
  await closePlayer();
  openDetails({ id: n.id, title: n.title, poster: n.poster });
}
$('eplist').onclick = openNow;
// In the open player the poster leads to the title; in the mini player the
// whole bar opens the player.
$('thumb').onclick = e => {
  if (layers.at(-1) != 'pl' || pending) return;
  e.stopPropagation();
  openNow();
};
$('devbtn').onclick = () => {
  openLayer('dev');
  renderDevices();
  loadDevices(true);
};
$('devname').onclick = $('devbtn').onclick;
$('devscan').onclick = () => loadDevices(true);
$('styb').onclick = () => {
  openLayer('sty');
  renderStyle();
};
$('styreset').onclick = () => setStyle(null);
$('stycollapse').onclick = closeTop;
const sliderStyle = () => ({ ...subStyle, size: +$('stysize').value, bg: +$('stybg').value });
$('stysize').oninput = $('stybg').oninput = () => renderStyle(sliderStyle());
$('stysize').onchange = $('stybg').onchange = () => setStyle(sliderStyle());
$('next').onclick = () => stepEpisode(1);
$('prev').onclick = () => stepEpisode(-1);
document.addEventListener('visibilitychange', () => {
  poll();
  if (!document.hidden) loadRecent();
});
$('q').oninput = () => {
  $('qx').hidden = !$('q').value;
  if (!$('q').value && searching) clearSearch();
};
$('qx').onclick = () => {
  clearSearch();
  $('q').focus();
};
// Opened by a title's address, back leads to the history underneath.
if (urlTitle() && !history.state) {
  const url = location.href;
  history.replaceState({ depth: 0 }, '', '/');
  history.pushState({ depth: 1 }, '', url);
}
route();
poll();
loadRecent();
loadDevices(false);
setInterval(poll, 2000);
setInterval(showTime, 250);
</script>
