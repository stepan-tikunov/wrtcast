      const nals = [], p = d.subarray(9 + d[8]);
      let s = -1;
      const unit = e => {
        while (e > s && !p[e - 1]) e--;
        const n = p.subarray(s, e), type = n[0] & 31;
        if (type == 7) sps ??= n;
        else if (type == 8) pps ??= n;
        else if (type != 9 && n.length) nals.push(n);
      };
      for (let i = 0; i + 2 < p.length; i++)
        if (!p[i] && !p[i + 1] && p[i + 2] == 1) {
          if (s >= 0) unit(i);
          s = i += 3;
          i--;
        }
      if (s >= 0) unit(p.length);
      if (pts == null) aus.at(-1)?.nals.push(...nals);
      else aus.push({ pts, dts, nals });
    }
    if (!sps || !pps) throw 'no parameter sets';
    const wrap = 2 ** 33, first = aus[0]?.dts;
    const samples = aus.filter(a => a.nals.length).map(a => {
      if (a.dts < first - wrap / 2) a.dts += wrap, a.pts += wrap;
      return {
        dts: a.dts, cts: a.pts - a.dts, key: a.nals.some(n => (n[0] & 31) == 5),
        data: cat(a.nals.flatMap(n => [Uint8Array.from(be(n.length)), n])),
      };
    });
    samples.forEach((x, i) => x.dur = i + 1 < samples.length ? samples[i + 1].dts - x.dts : samples[i - 1]?.dur ?? 3600);
    const avc1 = box('avc1', zero(6), [0, 1], zero(16), be(w, 2), be(h, 2),
      be(0x480000), be(0x480000), zero(4), [0, 1], zero(32), [0, 0x18, 0xff, 0xff],
      box('avcC', [1, sps[1], sps[2], sps[3], 0xff, 0xe1], be(sps.length, 2), sps, [1], be(pps.length, 2), pps));
    return { entry: avc1, codec: 'avc1.' + hex(sps.subarray(1, 4)), ts: 90000, samples };
  }

  // An init segment's video track: its id, timescale, sample entry and
  // defaults.
  function initMP4(b) {
    const moov = dig(b, [0, b.length], 'moov');
    let r = null;
    if (moov) walk(b, moov[0], moov[1], (type, s, e) => {
      const mdia = type == 'trak' && dig(b, [s, e], 'mdia'), hdlr = mdia && dig(b, mdia, 'hdlr');
      if (r || !hdlr || str4(b, hdlr[0] + 8) != 'vide') return;
      const tkhd = dig(b, [s, e], 'tkhd'), mdhd = dig(b, mdia, 'mdhd'), stsd = dig(b, mdia, 'minf', 'stbl', 'stsd');
      const at = x => x[0] + (b[x[0]] == 1 ? 20 : 12), id = u32(b, at(tkhd));
      const entry = b.slice(stsd[0] + 8, stsd[0] + 8 + u32(b, stsd[0] + 8)), kind = str4(entry, 4);
      const avcC = dig(entry, [86, entry.length], 'avcC');
      if (!/^avc[13]$/.test(kind) || !avcC) throw 'unsupported ' + kind;
      let def = [0, 0, 0];
      const mvex = dig(b, moov, 'mvex');
      if (mvex) walk(b, mvex[0], mvex[1], (t, s) => {
        if (t == 'trex' && u32(b, s + 4) == id) def = [u32(b, s + 12), u32(b, s + 16), u32(b, s + 20)];
      });
      r = { id, ts: u32(b, at(mdhd)), entry, def, codec: kind + '.' + hex(entry.subarray(avcC[0] + 1, avcC[0] + 4)) };
    });
    if (!r) throw 'no video track';
    return r;
  }

  // A fragmented MP4 segment's samples of the init's video track.
  function demuxMP4(b, init) {
    const samples = [];
    walk(b, 0, b.length, (type, s, e, moof) => type == 'moof' && walk(b, s, e, (type, s, e) => {
      const tfhd = type == 'traf' && dig(b, [s, e], 'tfhd');
      if (!tfhd || u32(b, tfhd[0] + 4) != init.id) return;
      let q = tfhd[0] + 8, base = moof;
      const rd = () => u32(b, (q += 4) - 4), fl = u32(b, tfhd[0]) & 0xffffff;
      if (fl & 1) base = rd() * 2 ** 32 + rd();
      if (fl & 2) rd();
      const dd = fl & 8 ? rd() : init.def[0], ds = fl & 16 ? rd() : init.def[1], df = fl & 32 ? rd() : init.def[2];
      const tfdt = dig(b, [s, e], 'tfdt');
      let dts = !tfdt ? samples.length ? samples.at(-1).dts + samples.at(-1).dur : 0 :
        b[tfdt[0]] == 1 ? u32(b, tfdt[0] + 4) * 2 ** 32 + u32(b, tfdt[0] + 8) : u32(b, tfdt[0] + 4);
      let pos = base;
      walk(b, s, e, (type, s) => {
        if (type != 'trun') return;
        q = s;
        const f = rd() & 0xffffff, n = rd();
        if (f & 1) pos = base + (rd() | 0);
        const first = f & 4 ? rd() : null;
        for (let k = 0; k < n; k++) {
          const dur = f & 0x100 ? rd() : dd, size = f & 0x200 ? rd() : ds;
          const flags = f & 0x400 ? rd() : k == 0 && first != null ? first : df;
          samples.push({ dts, dur, cts: f & 0x800 ? rd() | 0 : 0, key: !(flags & 0x10000), data: b.subarray(pos, pos + size) });
          dts += dur;
          pos += size;
        }
      });
    }));
    return samples;
  }

  // A video-only fragmented MP4: the init segment of a sample entry and a
  // fragment of the samples at the given decode time.
  function initSeg(entry, ts) {
    const w = entry[32] << 8 | entry[33], h = entry[34] << 8 | entry[35];
    const matrix = [...be(0x10000), ...zero(12), ...be(0x10000), ...zero(12), ...be(0x40000000)];
    return cat([
      box('ftyp', chars('isom'), be(0), chars('isomiso6avc1')),
      box('moov',
        box('mvhd', zero(12), be(ts), be(0), be(0x10000), [1, 0], zero(10), matrix, zero(24), be(2)),
        box('trak',
          box('tkhd', [0, 0, 0, 3], zero(8), be(1), zero(4), be(0), zero(16), matrix, be(w * 65536), be(h * 65536)),
          box('mdia',
            box('mdhd', zero(12), be(ts), be(0), [0x55, 0xc4, 0, 0]),
            box('hdlr', zero(8), chars('vide'), zero(13)),
            box('minf',
              box('vmhd', [0, 0, 0, 1], zero(8)),
              box('dinf', box('dref', zero(4), be(1), box('url ', [0, 0, 0, 1]))),
              box('stbl', box('stsd', zero(4), be(1), entry),
                box('stts', zero(8)), box('stsc', zero(8)), box('stsz', zero(12)), box('stco', zero(8)))))),
        box('mvex', box('trex', zero(4), be(1), be(1), zero(12)))),
    ]);
  }
  function fragment(samples, time, seq) {
    const table = [];
    for (const x of samples)
      table.push(...be(x.dur), ...be(x.data.length), ...be(x.key ? 0x2000000 : 0x1010000), ...be(x.cts >>> 0));
    const trun = box('trun', [1, 0, 0x0f, 0x01], be(samples.length), be(0), table);
    const moof = box('moof', box('mfhd', zero(4), be(seq)),
      box('traf', box('tfhd', [0, 2, 0, 0], be(1)), box('tfdt', [1, 0, 0, 0], be(time, 8)), trun));
    moof.set(be(moof.length + 8), moof.length - trun.length + 16);
    return cat([moof, box('mdat', ...samples.map(x => x.data))]);
  }

  const append = (sb, d) => new Promise((ok, no) => {
    sb.onupdateend = ok;
    sb.onerror = no;
    sb.appendBuffer(d);
  });

  // Fetches segment i and appends its video, at its time in the playlist.
  async function load(my, i) {
    const seg = my.segs[i], data = await get(seg.uri);
    let v;
    if (seg.init) {
      const init = await (my.inits[seg.init] ??= get(seg.init).then(initMP4));
      v = { ...init, samples: demuxMP4(data, init) };
    } else v = demuxTS(data, my.w, my.h);
    if (!v.samples.length) throw 'no video';
    if (s != my) return;
    // The first frame shown at the segment's time in the playlist, unless
    // that would decode before 0.
    const first = Math.min(...v.samples.map(x => x.dts + x.cts));
    const off = Math.max(Math.round(seg.t * v.ts) - first, -v.samples[0].dts);
    seg.a = (first + off) / v.ts;
    seg.b = (Math.max(...v.samples.map(x => x.dts + x.cts + x.dur)) + off) / v.ts;
    if (!my.sb) {
      const type = `video/mp4; codecs="${v.codec}"`;
      if (!MS.isTypeSupported(type)) throw 'unsupported ' + v.codec;
      const ms = new MS();
      video.disableRemotePlayback = true;
      video.src = my.url = URL.createObjectURL(ms);
      await new Promise(r => ms.addEventListener('sourceopen', r, { once: true }));
      my.sb = ms.addSourceBuffer(type);
      ms.duration = my.total;
    }
    await append(my.sb, initSeg(v.entry, v.ts));
    await append(my.sb, fragment(v.samples, v.samples[0].dts + off, ++my.seq));
  }

  const find = t => {
    const g = s.segs;
    let lo = 0, hi = g.length - 1;
    while (lo < hi) {
      const mid = lo + hi + 1 >> 1;
      if (g[mid].t <= t) lo = mid;
      else hi = mid - 1;
    }
    return lo;
  };
  const buffered = seg => {
    const t = (seg.a + seg.b) / 2, r = video.buffered;
    for (let i = 0; i < r.length; i++) if (r.start(i) <= t && t < r.end(i)) return true;
    return false;
  };

  function paint() {
    tip.classList.toggle('on', !!(active && s && !s.dead && (s.shown || s.busy)));
    tip.classList.toggle('stale', !fresh);
    tip.classList.toggle('busy', !!s?.busy);
  }
  function seek(t) {
    if (video.seeking) seekTo = t;
    else video.currentTime = t;
  }
  video.onseeked = () => {
    if (seekTo != null) {
      video.currentTime = seekTo;
      seekTo = null;
    } else if (s?.sb && !s.shown) {
      s.shown = true;
      paint();
    }
  };
  video.onresize = () => tip.style.aspectRatio = video.videoWidth + '/' + video.videoHeight;

  // Shows the time wanted if its segment is there, else asks for it once the
  // finger rests.
  function update() {
    if (!active || !s?.segs || s.dead || want == null) return paint();
    const i = find(want), seg = s.segs[i];
    if (s.done.has(i) && !buffered(seg)) s.done.delete(i); // evicted by the browser
    fresh = s.done.has(i);
    if (fresh) seek(Math.min(Math.max(want, seg.a), seg.b - .001));
    else {
      clearTimeout(timer);
      timer = setTimeout(pump, Math.max(rest + REST - Date.now(), 0));
    }
    paint();
  }
  async function pump() {
    const my = s;
    if (!active || !my?.segs || my.busy || my.dead) return;
    const wait = rest + REST - Date.now();
    if (wait > 0) return timer = setTimeout(pump, wait);
    const i = find(want);
    if (my.done.has(i) || my.failed.has(i)) return;
    my.busy = true;
    paint();
    try {
      await load(my, i);
      my.done.add(i);
    } catch (e) {
      // A refusal, a stream that can't be shown or a few failures end it.
      my.failed.add(i);
      const transient = typeof e == 'number' && e != 403 || e instanceof TypeError;
      if (!transient || ++my.fails >= 3) my.dead = true;
    }
    my.busy = false;
    if (s == my) update();
  }

  return {
    // A drag starts on media m: from the master the TV plays through the
    // proxy, without the quality and the leveler it asked for.
    start(m) {
      const src = m?.url?.match(/\/api\/p\/.*/)?.[0];
      if (!MS || !src) return;
      if (s?.src != src) {
        if (s?.url) {
          video.removeAttribute('src');
          video.load();
          URL.revokeObjectURL(s.url);
        }
        const my = s = { src, segs: null, done: new Set(), failed: new Set(), inits: {}, fails: 0, seq: 0 };
        const url = new URL(src.replace(/&(q|drc)=[^&]*/g, ''), location.href).href;
        playlist(url).then(p => {
          if (s != my) return;
          Object.assign(my, p);
          update();
        }, () => my.dead = true);
      }
      active = true;
      want = restX = null;
      fresh = false;
    },
    // The finger at time t, f of the way along the bar; moved once it has.
    show(t, f, moved) {
      if (!active) return;
      tip.style.setProperty('--f', f);
      if (!moved) return;
      want = t;
      const x = f * tip.parentNode.clientWidth;
      if (restX == null || Math.abs(x - restX) > 6) {
        restX = x;
        rest = Date.now();
      }
      update();
    },
    end() {
      active = false;
      want = null;
      clearTimeout(timer);
      paint();
    },
  };
})();

// ---- wiring -------------------------------------------------------------

$('f').onsubmit = e => {
  e.preventDefault();
  const q = $('q').value.trim();
  if (q.length < 3) return toast('Введите хотя бы 3 символа');
  $('q').blur();
  // The first search is a step back from the history; the next ones replace it.
  if (q == query); // a retry
  else if (searching) history.replaceState(history.state, '', searchUrl(q));
  else history.pushState({ depth: 0, search: 1 }, '', searchUrl(q));
  search(q);
};
// Back to the history: through back, if the search was entered here.
function clearSearch() {
  if (history.state?.search) history.back();
  else history.replaceState({ depth: 0 }, '', '/');
  showRecent();
}
document.querySelectorAll('[data-c]').forEach(b => b.onclick = e => {
  e.stopPropagation();
  const c = b.dataset.c;
  if (c == 'rew' || c == 'ff') skip(c == 'ff' ? +b.dataset.a : -b.dataset.a);
  else cmd(c, b.dataset.a);
});
$('bar').onclick = () => setPlayer(!plOpen);
$('collapse').onclick = e => {
  e.stopPropagation();
  setPlayer(false);
};
$('more').onclick = e => {
  e.stopPropagation();
  openLayer('opt');
};
$('optcollapse').onclick = closeTop;
$('shade').onclick = () => layers.at(-1) in SHEETS ? closeTop() : setPlayer(false);

// Playback speed: the button shows it, the browser's picker over it picks
// another. The Default Media Receiver refuses anything outside 0.5..2
// (INVALID_PARAMS).
const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
const speedLabel = r => +(+r).toFixed(2) + 'x';
function showSpeed(m) {
  const r = m.rate || 1;
  $('spd').classList.toggle('off', !!m.live);
  $('spd').classList.toggle('alt', r != 1);
  $('speed').textContent = speedLabel(r);
  $('spdsel').value = String(r);
}
$('spdsel').replaceChildren(...SPEEDS.map(r => el('option', { value: String(r) }, speedLabel(r))));
$('spd').onclick = e => e.stopPropagation();
$('spdsel').onchange = e => {
  const r = +e.target.value, m = st?.media;
  if (!m || r == (m.rate || 1)) return;
  // The position so far went at the old speed.
  m.time = position(m);
  statusAt = Date.now();
  m.rate = r;
  showSpeed(m);
  cmd('speed', r);
};

// Sliders: a drag anywhere moves the value from where it was by as much as
// the finger moves, not to under the finger; a mouse still jumps to the
// click. A tap alone changes nothing. start() gives the value and its
// maximum, or nothing when the slider can't be moved now; show() gets the
// value, the maximum and whether it has moved yet; end() gets the new
// value, or null if there's none.
function slider(box, { start, show, end }) {
  let d = null;
  box.onpointerdown = e => {
    const v = start();
    if (!v) return;
    e.preventDefault();
    box.setPointerCapture(e.pointerId);
    const r = box.getBoundingClientRect();
    d = { ...v, x: e.clientX, w: r.width, moved: e.pointerType == 'mouse' };
    if (d.moved) d.v = Math.min(Math.max((e.clientX - r.left) / r.width * d.max, 0), d.max);
    box.classList.add('on');
    show(d.v, d.max, d.moved);
  };
  box.onpointermove = e => {
    if (!d || e.clientX == d.x) return;
    d.v = Math.min(Math.max(d.v + (e.clientX - d.x) / d.w * d.max, 0), d.max);
    d.x = e.clientX;
    d.moved = true;
    show(d.v, d.max, true);
  };
  const stop = ok => {
    if (!d) return;
    const { v, moved } = d;
    d = null;
    box.classList.remove('on');
    end(ok && moved ? v : null);
  };
  box.onpointerup = () => stop(true);
  box.onpointercancel = () => stop(false);
}
const showLevel = (id, f) => $(id).firstChild.firstChild.style.width = 100 * Math.min(Math.max(f || 0, 0), 1) + '%';
function showPos(t, max) {
  showLevel('pos', max ? t / max : 0);
  $('cur').textContent = fmt(t);
  $('rem').textContent = max ? '−' + fmt(max - t) : '';
}
let volume = null;
const showVol = v => showLevel('vol', (volume = v) / 100);
slider($('pos'), {
  start() {
    const m = st?.media;
    if (!m?.duration || pending) return;
    drag = 'pos';
    preview.start(m);
    return { v: Math.min(position(m), m.duration), max: m.duration };
  },
  show(v, max, moved) {
    showPos(v, max);
    preview.show(v, v / max, moved);
  },
  end(v) {
    drag = null;
    preview.end();
    if (v != null && st?.media) {
      clearTimeout(seekTimer); // the drag wins over pending ±10 taps
      seekTimer = null;
      st.media.time = Math.round(v);
      statusAt = Date.now();
      cmd('seek', Math.round(v));
    }
    showTime();
  },
});
slider($('vol'), {
  start() {
    if (volume == null) return;
    drag = 'vol';
    return { v: volume, max: 100 };
  },
  show: showVol,
  end(v) {
    drag = null;
    if (v == null) showVol(st?.volume != null ? st.volume * 100 : volume);
    else cmd('volume', Math.round(v));
  },
});
$('audio').onchange = e => cmd('audio', e.target.value);
$('subs').onchange = e => cmd('subs', e.target.value);
// Replays what is on from the current position with some settings changed.
function replay(changes) {
  const n = st?.now, m = st?.media;
  if (!n || !m) return;
  play({ id: n.id, title: n.title, poster: n.poster, season: n.season, episode: n.episode,
    source: n.source, quality: n.quality, start: position(m).toFixed(1), rate: m.rate, reuse: 1, ...changes });
}
const activeTrack = type => st?.media?.tracks?.find(t => t.type == type && t.active)?.name;
$('quality').onchange = e => {
  localStorage.quality = e.target.value;
  replay({ quality: e.target.value, audio: activeTrack('AUDIO'), subs: activeTrack('TEXT') || 'off' });
};
// The leveled audio is another stream for the TV, so it is replayed too.
$('drc').onchange = e => {
  localStorage.drc = e.target.checked ? '1' : '0';
  replay({ drc: localStorage.drc, audio: activeTrack('AUDIO'), subs: activeTrack('TEXT') || 'off' });
};
// The router starts the next episode itself, also with the page closed.
$('autonext').onchange = async e => {
  localStorage.autonext = e.target.checked ? '1' : '0';
  try {
    render(await api(withDevice('autonext'), { on: localStorage.autonext }));
  } catch (err) {
    toast(err);
  }
};
// Another source has its own tracks, so audio and subtitles start fresh.
$('source').onchange = e => {
  replay({ source: e.target.value, quality: localStorage.quality });
};
// The page of what is on, under the player.
async function openNow() {
  const n = st?.now;
  if (!n) return;
  await closePlayer();
  openDetails({ id: n.id, title: n.title, poster: n.poster });
}
$('eplist').onclick = openNow;
// In the open player the poster leads to the title; in the mini player the
// whole bar opens the player.
$('thumb').onclick = e => {
  if (!plOpen || layers.at(-1) in SHEETS || pending) return;
  e.stopPropagation();
  openNow();
};
$('devbtn').onclick = () => {
  openLayer('dev');
  renderDevices();
  loadDevices(true);
};
$('devname').onclick = $('devbtn').onclick;
$('devscan').onclick = () => loadDevices(true);
$('styb').onclick = () => {
  openLayer('sty');
  renderStyle();
};
$('styreset').onclick = () => setStyle(null);
$('stycollapse').onclick = closeTop;
const sliderStyle = () => ({ ...subStyle, size: +$('stysize').value, bg: +$('stybg').value });
$('stysize').oninput = $('stybg').oninput = () => renderStyle(sliderStyle());
$('stysize').onchange = $('stybg').onchange = () => setStyle(sliderStyle());
$('next').onclick = () => stepEpisode(1);
$('prev').onclick = () => stepEpisode(-1);
document.addEventListener('visibilitychange', () => {
  poll();
  if (!document.hidden) loadRecent();
});
$('q').oninput = () => {
  $('qx').hidden = !$('q').value;
  if (!$('q').value && searching) clearSearch();
};
$('qx').onclick = () => {
  clearSearch();
  $('q').focus();
};
// Opened by a title's address, back leads to the history underneath.
if (urlTitle() && !history.state) {
  const url = location.href;
  history.replaceState({ depth: 0 }, '', '/');
  history.pushState({ depth: 1 }, '', url);
}
route();
poll();
loadRecent();
loadDevices(false);
setInterval(poll, 2000);
setInterval(showTime, 250);
</script>
